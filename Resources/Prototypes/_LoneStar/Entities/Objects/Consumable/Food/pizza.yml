
# Cheap Pizza

- type: entity
  parent: FoodInjectableBase
  id: FoodCheapPizzaBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - oily
      - bread
      - donk
  - type: Food
  - type: Sprite
    sprite: _LoneStar/Objects/Consumable/Food/pizza.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 60
        reagents:
        - ReagentId: Nutriment
          Quantity: 20
        - ReagentId: Protein
          Quantity: 2
        - ReagentId: Fat
          Quantity: 20
  - type: SliceableFood
    count: 8
  - type: Item
    size: Normal
    shape:
    - 0,0,2,1
  - type: Tag
    tags:
    - Pizza
    - CheapPizza
    - ReptilianFood

- type: entity
  parent: FoodInjectableBase # Not sliceable
  id: FoodCheapPizzaSliceBase
  abstract: true
  components:
  - type: FlavorProfile
    flavors:
      - oily
      - bread
      - donk
  - type: Food
  - type: Sprite
    sprite: _LoneStar/Objects/Consumable/Food/pizza.rsi
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Nutriment
          Quantity: 8
        - ReagentId: Protein
          Quantity: 0.8
        - ReagentId: Fat
          Quantity: 8
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Pizza
    - CheapPizza
    - ReptilianFood
    - Slice

