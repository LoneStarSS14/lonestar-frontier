# region actions
- type: entity
  parent: BaseToggleAction
  id: ActionToggleResponseSuitRed
  name: Toggle Siren
  description: Toggles the siren on and off.
  components:
  - type: Action
    useDelay: 1
    icon:
      sprite: Clothing/OuterClothing/Hardsuits/paramed.rsi
      state: icon-siren
    itemIconStyle: BigAction

- type: entity
  parent: BaseToggleAction
  id: ActionToggleResponseSuitBlue
