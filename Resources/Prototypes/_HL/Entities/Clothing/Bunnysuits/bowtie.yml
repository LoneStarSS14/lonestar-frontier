# LoneStar: file heavily modified regarding bases and sprite paths / .rsi states.
# region Bases
- type: entity
  abstract: true
  parent: ClothingNeckBase
  id: BaseBowtie
  components:
  - type: Tag
    tags:
    - Bunnysuit
    - ClothMade
    - WhitelistChameleon
    - WhitelistChameleonAdvancedCollar

- type: entity
  abstract: true
  parent: [ BaseBowtie, ClothingNeckFoldableBase]
  id: BaseBowtieFoldable
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "unfoldedLayer" ]
    - state: icon-untied
      map: ["foldedLayer"]
      visible: false
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: bowtie-tie
    foldVerbText: bowtie-untie
  - type: FoldableClothing
    foldedEquippedPrefix: untied
    foldedHeldPrefix: untied

