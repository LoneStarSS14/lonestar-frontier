
- type: entity
  parent: [ ClothingNeckBase, ClothingNeckColorableMono ]
  id: ClothingNeckTeddyRibbon
  name: teddy ribbon
  description: A big ribbon, like you'd see on a new stuffed toy.
  components:
  - type: ColorableClothing
    randomOnCreation: false
  - type: Sprite
    sprite: _LoneStar/Clothing/Neck/teddyribbon.rsi
    layers:
    - state: icon
      color: "#F06A6A"
      map: [ "neck-icon" ]
  - type: Clothing
    sprite: _LoneStar/Clothing/Neck/teddyribbon.rsi
    clothingVisuals:
      neck:
      - state: equipped-NECK
        color: "#F06A6A"
        map: [ "neck-equipped" ]
  - type: Engraveable
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
    - WhitelistChameleonAdvancedCollar

