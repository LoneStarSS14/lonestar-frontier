- type: pointOfInterest
  id: Cove
  parent: BasePOI
  name: 'The Den'
  minimumDistance: 7500 # LoneStar
  maximumDistance: 9000 # LoneStar
  spawnGamePreset: [ NFPirate ]
  spawnGroup: Required
  gridPath: /Maps/_LoneStar/POI/cove.yml
  hideWarp: true
  addComponents:
  - type: IFF
    color: "#C83737"

- type: gameMap
  id: Cove
  mapName: 'The Den'
  mapPath: /Maps/_LoneStar/POI/cove.yml
  minPlayers: 0
  stations:
    Cove:
      stationProto: RecordsFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: 'The Den'
        - type: ExtraStationInformation
          iconPath: /Textures/_NF/Interface/Pirate/piratelogo.png
          stationSubtext: 'frontier-lobby-pirate-subtext'
          stationDescription: 'frontier-lobby-pirate-description'
          lobbySortOrder: 6
        - type: StationJobs
          availableJobs:
            NFPirate: [ 5, 5 ]
            Smuggler: [ 5, 5 ] # Coyote
            Escort: [ 4, 4 ]
            RipperDoc: [ 4, 4 ]
        - type: StationDeadDropReporting
          messageSet: Pirate
        - type: StationDeadDropHintExempt
        - type: TradeCrateWildcardDestination
        - type: BindToStationVariationPassExemption
