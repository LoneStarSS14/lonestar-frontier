#region base
- type: entity
  id: ClothingUniformRandomPunkBase
  parent: [ ClothingUniformBase, RecyclableItemClothBasic ]
  description: Generated by neural networks based on the latest fashion trends.
  suffix: Random visuals
  abstract: true
  components:
  - type: Sprite
    sprite: _NF/Clothing/Uniforms/punk_procedural.rsi
  - type: Clothing
    sprite: _NF/Clothing/Uniforms/punk_procedural.rsi

#region top w/ pants
- type: entity
  id: ClothingUniformRandomPunkCroptop
  parent: ClothingUniformRandomPunkBase
  name: punk croptop jumpsuit
  components:
  - type: Sprite
    layers:
    - state: base_torso_armless
      map: [ "jumpsuit_top" ]
    - state: base_leg_standard
      map: [ "jumpsuit_bottom" ]
    - state: mask_null
      map: [ "jumpsuit_decor" ]
  - type: Clothing
    clothingVisuals:
      jumpsuit:
      - state: base_torso_armless
        map: [ "jumpsuit_top" ]
      - state: base_leg_standard
        map: [ "jumpsuit_bottom" ]
      - state: mask_null
        map: [ "jumpsuit_decor" ]
  - type: ColorableClothing # LoneStar
    denyReroll: false # LoneStar
    mappedColors:
      Primary: Cyberpunk
      Secondary: Cyberpunk
      Tertiary: Cyberpunk
    available:
      - jumpsuit_top:
          base_torso_croptop_armless: Primary
        jumpsuit_bottom:
          base_leg_standard: Secondary
        jumpsuit_decor:
          decor_base_torso_croptop_armless_01: Tertiary
          decor_base_torso_croptop_armless_02: Tertiary
          decor_base_torso_croptop_armless_03: Tertiary
          decor_base_leg_standard_01: Tertiary
          decor_base_leg_standard_02: Tertiary
          decor_base_leg_standard_03: Tertiary
          decor_base_leg_standard_04: Tertiary
          decor_base_leg_standard_05: Tertiary
          mask_null: ""

- type: entity
  id: ClothingUniformRandomPunkTanktop
  parent: ClothingUniformRandomPunkCroptop
  name: punk tanktop jumpsuit
  components:
  - type: ColorableClothing # LoneStar
    denyReroll: false
    available:
      - jumpsuit_top:
          base_torso_armless: Primary
        jumpsuit_bottom:
          base_leg_standard: Secondary
        jumpsuit_decor:
          decor_base_torso_croptop_armless_01: Tertiary
          decor_base_torso_croptop_armless_02: Tertiary
          decor_base_torso_croptop_armless_03: Tertiary
          decor_base_leg_standard_01: Tertiary
          decor_base_leg_standard_02: Tertiary
          decor_base_leg_standard_03: Tertiary
          decor_base_leg_standard_04: Tertiary
          decor_base_leg_standard_05: Tertiary
          mask_null: ""

- type: entity
