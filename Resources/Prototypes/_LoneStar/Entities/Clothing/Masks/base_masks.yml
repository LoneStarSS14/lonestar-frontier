
#region Colorable Bases
- type: entity # for sprites with a single colored layer
  abstract: true
  id: ClothingMaskRandomSpriteMono
  suffix: Random
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "mask-icon" ]
  - type: Clothing
    clothingVisuals:
      mask:
      - state: equipped-MASK
        map: [ "mask-equipped" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - mask-icon:
          icon: Base
        mask-equipped:
          equipped-MASK: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a set layer, and a single colored layer
  abstract: true
  id: ClothingMaskRandomSpriteBaseColor
  suffix: Random
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-color
      map: [ "mask-icon" ]
  - type: Clothing
    clothingVisuals:
      mask:
      - state: equipped-MASK
      - state: equipped-MASK-color
        map: [ "mask-equipped" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - mask-icon:
          icon-color: Base
        mask-equipped:
          equipped-MASK-color: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a set layer, and a single colored layer, supporting inhands
  abstract: true
  parent: ClothingMaskRandomSpriteBaseColor
  id: ClothingMaskRandomSpriteBaseColorInhand
  suffix: Random
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      - state: inhand-left-color
        map: [ "hl-color" ]
      right:
      - state: inhand-right
      - state: inhand-right-color
        map: [ "hr-color" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - mask-icon:
          icon-color: Base
        mask-equipped:
          equipped-MASK-color: Base
        hl-color:
          inhand-left-color: Base
        hr-color:
          inhand-right-color: Base
    mappedColors:
      Base: NTInteriorDesign

- type: entity # for sprites with a 2 colored layers
  abstract: true
  id: ClothingMaskRandomSpriteDualColor
  suffix: Random
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "mask-icon-primary" ]
    - state: icon-color
      map: [ "mask-icon-secondary" ]
  - type: Clothing
    clothingVisuals:
      mask:
      - state: equipped-MASK
        map: [ "mask-equipped-primary" ]
      - state: equipped-MASK-color
        map: [ "mask-equipped-secondary" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - mask-icon-primary:
          icon: Primary
        mask-icon-secondary:
          icon-color: Secondary
        mask-equipped-primary:
          equipped-MASK: Primary
        mask-equipped-secondary:
          equipped-MASK-color: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a 2 colored layers, supporting inhands
  abstract: true
  parent: ClothingMaskRandomSpriteDualColor
  id: ClothingMaskRandomSpriteDualColorInhand
  suffix: Random
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        map: [ "hl-primary" ]
      - state: inhand-left-color
        map: [ "hl-secondary" ]
      right:
      - state: inhand-right
        map: [ "hr-primary" ]
      - state: inhand-right-color
        map: [ "hr-secondary" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - mask-icon-primary:
          icon: Primary
        mask-icon-secondary:
          icon-color: Secondary
        mask-equipped-primary:
          equipped-MASK: Primary
        mask-equipped-secondary:
          equipped-MASK-color: Secondary
        hl-primary:
          inhand-left: Primary
        hl-secondary:
          inhand-left-color: Secondary
        hr-primary:
          inhand-right: Primary
        hr-secondary:
          inhand-right-color: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign
