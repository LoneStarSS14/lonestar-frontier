- type: entity
  parent: VendingMachine
  id: VendingMachineHawker
  name: hawker-vend
  description: A vending machine stocked with various.. items ..for those with unique tastes.
  components:
  - type: VendingMachine
    pack: HawkerInventory
    dispenseOnHitChance: 0.25
    dispenseOnHitThreshold: 2
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    denyState: deny-unshaded
    loopDeny: false
    ejectDelay: 1.9
    initialStockQuality: 1.0
  - type: DatasetVocalizer
    dataset: HawkerAds
  - type: SpeakOnUIClosed
    pack: HawkerGoodbyes
  - type: Sprite
    sprite: _CS/Structures/Machines/VendingMachines/hawker.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#B53C9D"
