# region plasma
- type: entity
  parent: BaseItem
  id: FuelPlasmaBulk
  name: compressed fuel-grade plasma core
  description: A hyper-compressed rod made of desaturated plasma, suitable for fuel.
  suffix: 600
  components:
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      FuelGradePlasma: 60000
  - type: Sprite
    sprite: _NF/Objects/Specific/Fuel/fuelgrade_material.rsi
    layers:
    - state: plasma
      map: ["base"]
  - type: StaticPrice
    price: 0
    vendPrice: 40000
  - type: NFFuel

