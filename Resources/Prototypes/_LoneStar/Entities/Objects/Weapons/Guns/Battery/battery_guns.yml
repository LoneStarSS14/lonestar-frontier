- type: entity
  name: EG-4a energy revolver
  parent: WeaponEnergyRevolver
  id: WeaponEnergyRevolverAntique
  description: An antique relic of a gun, has an inbuilt recharger that kicks in after not being shot for a brief while.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/Weapons/Guns/Battery/antique-erevolver.rsi
  - type: Clothing
    sprite: _LoneStar/Objects/Weapons/Guns/Battery/antique-erevolver.rsi
  - type: Gun
    fireRate: 2.4
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
    soundEmpty:
      path: /Audio/_DV/Weapons/Guns/Empty/dry_fire.ogg
  - type: Battery
    maxCharge: 240
    startingCharge: 240
  - type: EnergyGun
    fireModes:
    - proto: NFBulletDisabler
      fireCost: 20
      name: disable
      state: disabler
    - proto: BulletEnergyGunMagnum
      fireCost: 40
      name: lethal
      state: lethal
  - type: Appearance
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 120
    autoRechargePause: true
    autoRechargePauseTime: 8

- type: entity
  name: LSRD pulse carbine
  parent: [BaseWeaponBattery, BaseGunWieldable, BaseC4ContrabandUnredeemable]
  id: WeaponPulseCarbineLSRD
  description: An older model of Pulse weapon, often used by the TSF Navy's special operations troops this weapon is not as potent as the standard issue ones, but it still hurts.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/Weapons/Guns/Battery/lsrdpulse_carbine.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Clothing
    sprite: _LoneStar/Objects/Weapons/Guns/Battery/lsrdpulse_carbine.rsi
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 3
    availableModes:
      - SemiAuto
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
  - type: HitscanBatteryAmmoProvider
    proto: PulseWeak 
    fireCost: 200
  - type: Battery
    maxCharge: 5000
    startingCharge: 5000

- type: entity
  id: WeaponEnergyPistolPulseLSRD
  parent: [ BaseC4ContrabandUnredeemable, NFBaseWeaponFrameEnergyPistolNanotrasen ]
  name: LSRD pulse pistol
  description: An older model of a pulse pistol, often used by the TSF Navy's special operations troops this weapon is not as potent as the standard issue ones, but it still hurts.
    A state of the art energy pistol favoured as a sidearm by the NT operatives. On the handle is a label that says 'for authorized use only.'
  components:
  - type: Gun
    examineCaliber: gun-examine-pulse-low
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
  - type: Sprite
    sprite: _LoneStar/Objects/Weapons/Guns/Battery/lsrdpulse_pistol.rsi
  - type: Clothing
    sprite: _LoneStar/Objects/Weapons/Guns/Battery/lsrdpulse_pistol.rsi
  - type: HitscanBatteryAmmoProvider
    proto: PulseWeak
    fireCost: 60
  - type: Battery # 20 shots
    maxCharge: 1200
    startingCharge: 1200

- type: entity
  name: LSRD heavy pulse rifle
  parent: [BaseWeaponBattery, BaseGunWieldable, BaseC4ContrabandUnredeemable]
  id: WeaponPulseRifleLSRD
  description: Like the other LSRD Pulse Weapons, this Rifle is an older model, however it has been heavily modified by the LSRD to increase it's potency.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/Weapons/Guns/Battery/lsrdpulse_heavy.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Clothing
    sprite: _LoneStar/Objects/Weapons/Guns/Battery/lsrdpulse_heavy.rsi
  - type: Gun
    fireRate: 1.5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser3.ogg
  - type: HitscanBatteryAmmoProvider
    proto: NFPulse
    fireCost: 100
  - type: Battery
    maxCharge: 4000
    startingCharge: 4000
