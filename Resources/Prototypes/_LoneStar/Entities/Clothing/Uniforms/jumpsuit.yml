#region Regal Suit
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitRegalSuitPrince
  name: red regal suit
  components:
  - type: Sprite
    sprite: _LoneStar/Clothing/Uniforms/Jumpsuit/regal-suit.rsi
  - type: Clothing
    sprite: _LoneStar/Clothing/Uniforms/Jumpsuit/regal-suit.rsi

- type: entity
  parent: ClothingUniformJumpsuitRegalSuitPrince
  id: ClothingUniformJumpsuitRegalSuitBlue
  name: blue regal suit
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-detail
      color: "#5882c6"
  - type: Clothing
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
      - state: equipped-INNERCLOTHING-detail
        color: "#5882c6"

