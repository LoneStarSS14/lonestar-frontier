## Naming form; dress = no apron, uniform = built in apron
#region Base
- type: entity
  parent: ClothingUniformSkirtBase
  id: BaseClothingUniformJumpskirtMaidUniform2Tone
  abstract: true
  name: maid uniform
  components:
  - type: Sprite
    layers:
    - state: icon-primary
      map: [ "i-primary" ]
      color: "#F8F6F3"
    - state: icon-secondary
      map: [ "i-secondary" ]
      color: "#4B4F55"
  - type: Clothing
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING-primary
        map: [ "uniform-primary" ]
        color: "#F8F6F3"
      - state: equipped-INNERCLOTHING-secondary
        map: [ "uniform-secondary" ]
        color: "#4B4F55"
  - type: Item
    sprite: _LoneStar/Clothing/generic-inhands.rsi
    inhandVisuals:
      left:
      - state: inhand-left-primary
        map: [ "hl-primary" ]
        color: "#F8F6F3"
      - state: inhand-left-secondary
        map: [ "hl-secondary" ]
        color: "#4B4F55"
      right:
      - state: inhand-right-primary
        map: [ "hr-primary" ]
        color: "#F8F6F3"
      - state: inhand-right-secondary
        map: [ "hr-secondary" ]
        color: "#4B4F55"
  - type: ColorableClothing
    randomOnCreation: false
    mappedColors:
      Shirt: LSSilks
      Dress: NTInteriorDesign
    available:
      - i-primary:
          icon-primary: Shirt
        i-secondary:
          icon-secondary: Dress
        uniform-primary:
          equipped-INNERCLOTHING-primary: Shirt
        uniform-secondary:
          equipped-INNERCLOTHING-secondary: Dress
        hl-primary:
          inhand-left-primary: Shirt
        hl-secondary:
          inhand-left-secondary: Dress
        hr-primary:
          inhand-right-primary: Shirt
        hr-secondary:
          inhand-right-secondary: Dress

