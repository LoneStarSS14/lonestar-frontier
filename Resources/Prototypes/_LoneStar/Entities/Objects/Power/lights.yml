- type: entity
  parent: ExteriorLightBulb
  name: green exterior light bulb
  id: ExteriorLightBulbGreen
  description: A colorful light bulb with a small colored crystal inside.
  components:
  - type: LightBulb
    color: "#00FF00"

- type: entity
  parent: ExteriorLightBulb
  name: magenta exterior light bulb
  id: ExteriorLightBulbMagenta
  description: A colorful light bulb with a small colored crystal inside.
  components:
  - type: LightBulb
    color: "#FF00FF"

- type: entity
  parent: ExteriorLightTube
  name: green exterior light tube
  description: A high power high energy green bulb for the depths of space. May contain mercury.
  id: ExteriorLightTubeGreen
  components:
  - type: LightBulb
    color: "#00FF00"

- type: entity
  parent: ExteriorLightTube
  name: magenta exterior light tube
  description: A high power high energy magenta bulb for the depths of space. May contain mercury.
  id: ExteriorLightTubeMagenta
  components:
  - type: LightBulb
    color: "#FF00FF"

- type: entity
  name: green floodlight
  id: FloodlightGreen
  parent: Floodlight
  description: A pole with powerful green lights on it.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/Misc/Lights/floodlight-green.rsi
    layers:
    - state: icon
      map: [ "base" ]
    - state: icon-on
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: PointLight
    enabled: false
    color: "#00FF00"

- type: entity
  name: magenta floodlight
  id: FloodlightMagenta
  parent: Floodlight
  description: A pole with powerful magenta lights on it.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/Misc/Lights/floodlight-magenta.rsi
    layers:
    - state: icon
      map: [ "base" ]
    - state: icon-on
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: PointLight
    enabled: false
    color: "#FF00FF"

- type: entity
  name: green lantern
  parent: Lantern
  id: LanternGreen
  description: The holy green light guides the way.
  components:
#  - type: Sprite
#    sprite: Objects/Tools/lantern.rsi
#    color: "#73FF73"
  - type: Sprite
    sprite: _LoneStar/Objects/Tools/lantern-green.rsi
    layers:
    - state: icon
    - state: icon-on
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: ToggleableVisuals
    sprite: _LoneStar/Objects/Tools/lantern-green.rsi
    spriteLayer: light
    inhandVisuals:
      left:
      - state: on-inhand-left
        shader: unshaded
      right:
      - state: on-inhand-right
        shader: unshaded
  - type: PointLight
    radius: 4
    energy: 3
    color: "#00FF00"

- type: entity
  name: magenta lantern
  parent: Lantern
  id: LanternMagenta
  description: The holy magenta light guides the way.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/Tools/lantern-magenta.rsi
    layers:
    - state: icon
    - state: icon-on
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: ToggleableVisuals
    sprite: _LoneStar/Objects/Tools/lantern-magenta.rsi
    spriteLayer: light
    inhandVisuals:
      left:
      - state: on-inhand-left
        shader: unshaded
      right:
      - state: on-inhand-right
        shader: unshaded
  - type: PointLight
    radius: 4
    energy: 3
    color: "#FF00FF"
