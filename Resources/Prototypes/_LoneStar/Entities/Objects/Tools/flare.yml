- type: entity  #LoneStar Adds blue flare dispenser box for colorblind accessiblity
  id: BoxDispenserFlareBlue
  parent: BaseAmmoProvider # this is for cycling flares out and not spawning 9 entities
  name: blue flare dispenser
  description: Dispenses blue emergency flares.
  components:
  - type: Sprite
    layers:
    - state: boxwide
      color: "#7373FF"
    - state: flare
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - Flare
    proto: FlareBlue
    capacity: 12
  - type: StaticPrice
    price: 10

- type: entity #LoneStar Adds magenta flare dispenser for colorblind accessibility
  id: BoxDispenserFlareMagenta
  parent: BaseAmmoProvider # this is for cycling flares out and not spawning 9 entities
  name: magenta flare dispenser
  description: Dispenses magenta emergency flares.
  components:
  - type: Sprite
    layers:
    - state: boxwide
      color: "#FF73FF"
    - state: flare
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - Flare
    proto: FlareMagenta
    capacity: 12
  - type: StaticPrice
    price: 10

- type: entity #LoneStar Adds blue flares for dispenser
  name: blue flare
  parent: [BaseItem, RecyclableItemSteelTiny] # Frontier: added RecyclableItemSteelTiny
  id: FlareBlue
  description: A flare that produces a very bright blue light for a short while. Point the flame away from yourself.
  components:
  - type: GoblinPreciousTrash # Frontier
  - type: Tag
    tags:
    - Flare
    - Trash
  - type: SpaceGarbage
  - type: ExpendableLight
    glowDuration: 225
    fadeOutDuration: 15
    iconStateOn: flare_unlit
    iconStateSpent: flare_spent
    turnOnBehaviourID: turn_on
    fadeOutBehaviourID: fade_out
    litSound:
      path: /Audio/Items/Flare/flare_on.ogg
    loopedSound:
      path: /Audio/Items/Flare/flare_burn.ogg
      params:
        loop: true
        volume: -10
        maxDistance: 5
  - type: Sprite
    sprite: Objects/Misc/flare.rsi
    layers:
    - map: [ enum.ExpendableLightVisualLayers.Base ]
      state: flare_base
    - map: [ enum.ExpendableLightVisualLayers.Glow ]
      state: flare_burn
      color: "#4040FF"
      visible: false
      shader: unshaded
    - map: [ enum.ExpendableLightVisualLayers.Overlay ]
      state: flare_unlit
      color: "#0000FF"
  - type: Icon
    sprite: Objects/Misc/flare.rsi
    state: icon
  - type: Item
    sprite: Objects/Misc/flare.rsi
    heldPrefix: unlit
    size: Tiny
  - type: Appearance
  - type: PointLight
    enabled: false
    color: "#0000FF"
    radius: 1.0
    energy: 9.0
    netsync: false
  - type: IgnitionSource
    temperature: 1000
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour # have the radius start small and get larger as it starts to burn
      id: turn_on
      maxDuration: 45.0
      startValue: 2.5
      endValue: 10.0
    - !type:RandomizeBehaviour # weaker flicker as it fades out
      id: fade_out
      interpolate: Nearest
      minDuration: 0.001
      maxDuration: 0.001
      startValue: 4.0
      endValue: 8.0
      property: Energy
      isLooped: true
    - !type:FadeBehaviour # fade out radius as it burns out
      id: fade_out
      maxDuration: 15.0
      startValue: 10.0
      endValue: 1.0
  - type: Extractable
    grindableSolutionName: flare
  - type: SolutionContainerManager
    solutions:
      flare:
        maxVol: 20
        reagents:
        # flare casing
        - ReagentId: Iron
          Quantity: 10
        # red phosphorus = red flare trust
        - ReagentId: Phosphorus
          Quantity: 3
        - ReagentId: Carbon
          Quantity: 1
        - ReagentId: Oxygen
          Quantity: 2
        # fuel or something
        - ReagentId: Charcoal
          Quantity: 2
        - ReagentId: Sulfur
          Quantity: 2


