# Mantis Clothes Port from the Den

- type: entity
  parent: [ClothingHeadBase, BaseFoldable]
  id: ClothingHeadHatFezMantisAiry
  name: airy mantis fez
  description: "A modest cap decorated with a thick tassle that can be worn over either eye. But it must be worn over an eye, as tradition dictates."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/mantis_fez_airy.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-flipped
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/mantis_fez_airy.rsi
  - type: Foldable
    canFoldInsideContainer: true
    foldVerbText: fold-flip-verb
    unfoldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped

- type: entity
  parent: [ClothingHeadBase, BaseFoldable]
  id: ClothingHeadHatFezMantisOrnate
  name: ornate mantis fez
  description: A structured cap with a chained veil that can be folded up and out of the way, if you have no taste. Or perhaps there's something else covering your eyes already? You're sure it's fine.
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/mantis_fez_ornate.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-folded
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/mantis_fez_ornate.rsi
  - type: Foldable
    canFoldInsideContainer: true
    foldVerbText: fold-verb
    unfoldVerbText: unfold-verb
  - type: FoldableClothing
    foldedEquippedPrefix: folded

- type: entity
  parent: ClothingHeadHatFezMantisOrnate
  id: ClothingHeadHatFezMantisOrnateFolded
  categories: [ HideSpawnMenu ]
  suffix: Folded
  components:
  - type: Foldable
    folded: true
  - type: Clothing
    equippedPrefix: folded

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatMantisShroud
  name: mantis mati
  description: "A broad traveler's hat with a hanging veil, keeping sun and rain at bay while the world fades at the edges. So named for the watchful eye engraved into its crown."
  categories: [ HideSpawnMenu ] # Really should only come from ClothingNeckCloakMantisShroud
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/mantis_shroud_hat.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/mantis_shroud_hat.rsi
  - type: IdentityBlocker
  - type: HideLayerClothing
    slots:
    - Hair

- type: entity
  parent: ClothingHeadHatBeret
  id: ClothingHeadHatParamedicBeret
  name: paramedic beret
  description: "A beret worn by emergency medical technicians and the like, adorned with a white cross."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/beret_paramedic.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/beret_paramedic.rsi

# siren beret start
- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatParamedicSirenBeret
  name: salvation shako
  description: "A noisy beret used to indicate a medical emergency response. Requires batteries. Not actually a shako."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hats/beret_paramedic_siren.rsi
    layers:
      - state: icon
      - state: icon-light
        visible: false
        shader: unshaded
        map: [ "light" ]
  - type: Appearance
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hats/beret_paramedic_siren.rsi
    equippedPrefix: off
  - type: ItemToggle
    predictable: false
    onUse: false
    soundActivate:
      path: /Audio/Items/flashlight_on.ogg
    soundDeactivate:
      path: /Audio/Items/flashlight_off.ogg
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/_Impstation/Effects/Vehicle/ambulancesiren.ogg
      params:
        volume: -3
  - type: UseDelay
    delay: 1.0
  - type: ToggleClothing
    action: ActionToggleSalvationShako
  - type: ItemTogglePointLight
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
  - type: PointLight
    enabled: false
    radius: 1.4
    energy: 2
    color: deepskyblue
    netsync: false
    mask: /Textures/Effects/LightMasks/double_cone.png
  - type: RotatingLight
    speed: 360
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmall
  - type: PowerCellDraw
    drawRate: 1
  - type: ToggleCellDraw

- type: entity
  parent: ClothingHeadHatParamedicSirenBeret
  id: ClothingHeadHatParamedicSirenBeretEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default

- type: entity
  id: ActionToggleSalvationShako
  name: Toggle Salvation Shako
  description: Turn the siren on or off.
  components:
  - type: InstantAction
    itemIconStyle: BigItem
    event: !type:ToggleActionEvent
# siren beret end
