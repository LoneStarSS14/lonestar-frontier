- type: job
  id: LSRetrievalOfficer
  name: job-name-ls-retrieval-officer
  description: job-description-ls-retrieval-officer
  supervisors: job-supervisors-ls-master-at-arms
  playTimeTracker: JobLSRetrievalOfficer
  whitelisted: true
  requirements:
    # - !type:DepartmentTimeRequirement # To be enabled 2 weeks after implementation
    #   department: LSFreelancers
    #   time: 57600 # 16 hours
  weight: 50
  displayWeight: 50
  startingGear: LSRetrievalOfficerGear
  icon: "JobIconLSRetrievalOfficer"
  # Frontier's fields
  hideConsoleVisibility: true
  newPlayerMessage: false
  # Common v
  accessGroups:
  - GeneralNfsdAccess
  special:
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
  #freelancer specific
  - !type:AddComponentSpecial
    components:
    - type: IsPirate
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, TrackingImplant ]
  #RPI
  # TODO: Add rpis
  - !type:AddComponentSpecial
    components:
    - type: PaywardProximityShuttleConsole # TODO: Look into how useful this even is.

- type: entity
  id: SpawnPointLSRetrievalOfficer # TODO: mapping migrations.
  parent: SpawnPointJobBase
  name: retrieval officer spawn point
  suffix: LoneStar
  components:
  - type: SpawnPoint
    job_id: LSRetrievalOfficer
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner-red

- type: startingGear
  id: LSRetrievalOfficerGear
  equipment: # TODO: add PDA
    pocket1: NFWeaponPistolUniversalNfsdLessLethal
    pocket2: ContrabandAppraisalTool
  storage:
    back:
    - Flash
    - CSMagazinePistol40Overpressure
    - CSMagazinePistol40Rubber
    - BaseSecurityUplinkRadioOfficer

- type: roleLoadout
  id: JobLSRetrievalOfficer
  canCustomizeName: true
  groups:
  # Unique v
  - LSLSRDRetrievalOfficerPDA
  # LSRD v
  - LSLSRDFactionCombatantJumpsuit
  - LSLSRDFactionCombatantOuterClothing
  - LSLSRDFactionCombatantShoes
  - LSLSRDFactionCombatantGloves
  - LSLSRDFactionCombatantHead
  - LSLSRDFactionCombatantMask
  - LSLSRDFactionCombatantEyes
  - LSLSRDFactionCombatantNeck
  - LSLSRDFactionCombatantEars
  - LSLSRDFactionCombatantBackpack
  - LSLSRDFactionCombatantBelt
  - LSLSRDFactionCombatantWallet
  - LSLSRDFactionCombatantEncryptionKey
  - LSLSRDFactionCombatantImplanter
  # Common v
  - ContractorBoxSurvival
  - ContractorWallet
  - PirateBackpackItems
  - ContractorHandItems
  - ContractorInstruments
  - NFSpeciesSpecific
