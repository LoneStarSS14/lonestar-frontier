#region colorable
- type: entity
  parent: [ ClothingUniformBase, ClothingUniformRandomSpriteMono ]
  id: ClothingUniformTurtleneckColorable
  name: white turtleneck
  description: For some reason, wearing this makes you feel like working in tech support at a product store.
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Uniforms/Jumpsuit/whiteturtleneck.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Uniforms/Jumpsuit/whiteturtleneck.rsi

#region foldables
- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitMilitaryBrat
  name: military brat's cargo pants
  description: For the ones who've done horrible things and looked cute doing them.
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Uniforms/Jumpsuit/militarybrat.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Uniforms/Jumpsuit/militarybrat.rsi
  - type: Foldable
    canFoldInsideContainer: true
  - type: FoldableClothing
    foldedEquippedPrefix: flipped
    foldedHeldPrefix: flipped
- type: entity
  parent: ClothingUniformJumpsuitMilitaryBrat
  id: ClothingUniformJumpsuitMilitaryBratFlipped
  name: military brat's cargo pants
  components:
  - type: Foldable
    folded: true

