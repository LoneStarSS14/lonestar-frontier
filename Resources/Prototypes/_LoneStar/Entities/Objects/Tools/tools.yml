- type: entity
  parent: BaseItem
  id: MagicNeedle
  name: magic needle
  description: A magic tool capable of restitching randomized clothing a-new.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/Tools/magic-needle.rsi
    state: icon
  - type: Item
    sprite: _LoneStar/Objects/Tools/magic-needle.rsi
    size: Tiny
  - type: Colorizer
    denyRerollMessage: colorizer-denyreroll-restitch
    rerollSound:
      path: /Audio/Items/wirecutter.ogg
      params:
        variation: 0.175
        volume: -4
  - type: UserInterface
    interfaces:
      enum.ColorizerUiKey.Key:
        type: ColorizerBoundUserInterface
  - type: ActivatableUI
    key: enum.ColorizerUiKey.Key
    inHandsOnly: true
    requireActiveHand: true
    verbOnly: true