#region Base
- type: entity
  abstract: true
  id: BaseAdvancedCollar
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Neck/Collars/collar_black.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Neck/Collars/collar_black.rsi
    equipDelay: 1
    unequipDelay: 5
  - type: AdvancedCollar
    maxModules: 7
  - type: ContainerContainer
    containers:
      collar_module_container: !type:Container
  - type: Tag # These are all duplicates, shouldnt be chameleon options.
    tags:
    - Recyclable

- type: entity
  abstract: true
  parent: [ ClothingNeckCollarBase, BaseAdvancedCollar ]
  id: ClothingNeckAdvancedCollarBase
  name: advanced collar
  description: A modular collar that can have various functional modules installed.

- type: entity
  abstract: true
  parent: [ ClothingNeckCollarBaseFoldable, BaseAdvancedCollar ]
  id: ClothingNeckAdvancedCollarFoldableBase
  name: advanced collar
  description: A modular collar that can have various functional modules installed.

