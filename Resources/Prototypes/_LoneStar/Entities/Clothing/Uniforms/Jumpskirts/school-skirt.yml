#region Base
- type: entity
  parent: ClothingUniformSkirtBase
  id: ClothingUniformBaseJumpskirtSchool
  abstract: true
  name: school skirt
  description: A stylish and comfortable school skirt.
  components:
  - type: Sprite
    sprite: _LoneStar/Clothing/Uniforms/Jumpskirt/school-skirt.rsi
    layers:
    - state: icon-primary
      map: [ "i-primary" ]
    - state: icon-secondary
      map: [ "i-secondary" ]
    - state: icon-tertiary
      map: [ "i-tertiary" ]
  - type: Clothing
    sprite: _LoneStar/Clothing/Uniforms/Jumpskirt/school-skirt.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING-primary
        map: [ "uniform-primary" ]
      - state: equipped-INNERCLOTHING-secondary
        map: [ "uniform-secondary" ]
      - state: equipped-INNERCLOTHING-tertiary
        map: [ "uniform-tertiary" ]
  - type: Item
    inhandVisuals:
      left:
        - state: inhand-left-primary
          map: [ "hl-primary" ]
        - state: inhand-left-secondary
          map: [ "hl-secondary" ]
      right:
        - state: inhand-right-primary
          map: [ "hr-primary" ]
        - state: inhand-right-secondary
          map: [ "hr-secondary" ]
  - type: ColorableClothing
    randomOnCreation: false
    mappedColors:
      Shirt: LSSilks
      Dress: NTInteriorDesign
      Ribbon: NTInteriorDesign
    available:
      - i-primary:
          icon-primary: Shirt
        i-secondary:
          icon-secondary: Dress
        i-tertiary:
          icon-tertiary: Ribbon
        uniform-primary:
          equipped-INNERCLOTHING-primary: Shirt
        uniform-secondary:
          equipped-INNERCLOTHING-secondary: Dress
        uniform-tertiary:
          equipped-INNERCLOTHING-tertiary: Ribbon
        hl-primary:
          inhand-left-primary: Shirt
        hl-secondary:
          inhand-left-secondary: Dress
        hr-primary:
          inhand-right-primary: Shirt
        hr-secondary:
          inhand-right-secondary: Dress

#region Randomized
- type: entity
  parent: ClothingUniformJumpskirtBaseSchool
  id: ClothingUniformJumpskirtSchoolRandom
  components:
  - type: ColorableClothing
    randomOnCreation: true

