- type: entity
  id: BioDjinnMachineCircuitboard
  parent: BiogeneratorMachineCircuitboard
  name: Bio Djinn machine board
  description: A machine printed circuit board for a Bio Djinn.
  components:
    - type: MachineBoard
      prototype: BioDjinn
      requirements:
        MatterBin: 1
        Manipulator: 1
      tagRequirements:
        GlassBeaker:
          amount: 1
          defaultPrototype: Beaker

- type: entity # LoneStar TODO: move this out
  id: LSSmartFridgeCircuitboard
  parent: BaseMachineCircuitboard
  name: SmartFridge machine board
  description: A machine printed circuit board for a SmartFridge.
  components:
  - type: Sprite
    state: service
  - type: MachineBoard
    prototype: LSSmartFridge
    requirements:
      Manipulator: 1
      Capacitor: 3
      MatterBin: 1
    stackRequirements:
      Glass: 5
    tagRequirements:
      GlassBeaker:
        amount: 2
        defaultPrototype: Beaker

- type: entity
  id: BangWizCircuitboard
  parent: LSSmartFridgeCircuitboard
  name: Bang Wiz machine board
  description: A totally nova circuit board for a Bang Wiz. Big boomba for choombas.
  components:
  - type: Sprite
    sprite: _NF/Objects/Misc/module.rsi
    state: hacked-merc-fab-board
  - type: MachineBoard
    prototype: BangWiz
