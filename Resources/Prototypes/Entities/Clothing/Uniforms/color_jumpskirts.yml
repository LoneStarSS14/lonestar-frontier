## LoneStar, all sprite/item/clothing map lines added, also BaseClothingUniformJumpsuitColorable parent added

# White Jumpskirt
- type: entity
  parent: [ ClothingUniformSkirtBase, BaseClothingUniformJumpsuitColorable ]
  id: ClothingUniformJumpskirtColorWhite
  name: white jumpskirt
  description: A generic white jumpskirt with no rank markings.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpskirt/color.rsi
    layers:
    - state: icon
      map: [ "uniform-icon" ]
    - state: trinkets-icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        map: [ "hl-color" ]
      - state: trinkets-inhand-left
      right:
      - state: inhand-right
        map: [ "hr-color" ]
      - state: trinkets-inhand-right
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpskirt/color.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        map: [ "uniform-equipped" ]
      - state: trinkets-equipped-INNERCLOTHING

