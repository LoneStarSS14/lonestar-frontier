- type: job
  id: NFPirate
  name: job-name-nf-pirate
  description: job-description-nf-pirate
  playTimeTracker: JobPirate
  requirements:
    - !type:OverallPlaytimeRequirement
      time: 86400 # 24 hours
    - !type:DepartmentTimeRequirement
      department: Security
      time: 10800 # 3 hrs
  startingGear: NFPirateGear
  alwaysUseSpawner: true
  hideConsoleVisibility: true
  canBeAntag: true
  icon: "JobIconNFPirate"
  supervisors: job-supervisors-nf-pirate
  weight: 20
  displayWeight: 20
  setPreference: true
  newPlayerMessage: false
  access:
  - Pirate
  accessGroups:
  - GeneralAccess
  special:
  - !type:AddComponentSpecial
    components:
    - type: AutoPirate
    - type: SpecialSectorStationRecord # must be given on spawn
      recordGeneration: FalseRecord
    - type: DisableSuitSensors
  - !type:AddImplantSpecial
    implants: [ FreelanceTrackingImplant ]
  - !type:GiveItemOnHolidaySpecial # Even pirates get a piece of cake.
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
- type: startingGear
  id: NFPirateGear
  equipment:
    pocket1: BasePirateUplinkPirateCrew
  storage:
    back:
    - ContrabandAppraisalToolPirate
    - ComputerIFFFlatpack
- type: chameleonOutfit
  id: NFPirateChameleonOutfit
  job: NFPirate

- type: roleLoadout
  id: JobNFPirate
  groups:
  - FreelancerFactionHead # LoneStar
  - FreelancerFactionNeck # LoneStar
  - FreelancerFactionJumpsuit # LoneStar
  - MercenaryGloves # Coyote: Pirate Loadout Expansion
  - ContractorBackpack
  - FreelancerFactionOuterClothing # LoneStar
  - NFPirateShoes
  - NFPirateFace
  - MercenaryGlasses # Coyote: Pirate Loadout Expansion
  - MercenaryBelt # Coyote: Pirate Loadout Expansion
  - PilotEars # LoneStar
  - FreelancerEncryptionKey # Coyote: Pirates get comm keys
  - ContractorBoxSurvival
  - SmugglerPDA
  - ContractorWallet
  - PirateBackpackItems
  - ContractorHandItems
  - ContractorInstruments # Coyote
  - NFSpeciesSpecific
  canCustomizeName: true # pseudonym?
