
- type: entity
  id: ClothingBeltPunkRandomized
  parent: [ NFClothingBeltStorageHolsterBase, RecyclableItemClothBasic,  ]
  name: punk belt
  description: A webbing with functional pockets.
  suffix: Random visuals
  components:
  - type: Sprite
    sprite: _NF/Clothing/Belt/punk.rsi
    layers:
    - state: icon_belt_01
      map: [ "belt_main" ]
    - state: icon_decor_base_belt_01
      map: [ "belt_decor" ]
  - type: Clothing
    sprite: _NF/Clothing/Belt/punk.rsi
    clothingVisuals:
      belt:
      - state: base_belt_01
        map: [ "clothing_belt_main" ]
      - state: decor_base_belt_01
        map: [ "clothing_belt_decor" ]
      - state: mask_null
        map: [ "clothing_belt_overlay" ]
  - type: ColorableClothing # LoneStar
    mappedColors:
      Primary: CyberpunkDark
      Secondary: CyberpunkDark
      Tertiary: CyberpunkDark
    available:
      - belt_main:
          icon_belt_01: Primary
        clothing_belt_main:
          base_belt_01: Primary
        belt_decor:
          icon_decor_base_belt_01: Secondary
        clothing_belt_decor:
          decor_base_belt_01: Secondary
        clothing_belt_overlay:
          decor_base_belt_02: Tertiary
          decor_base_belt_03: Tertiary
          decor_base_belt_04: Tertiary
          decor_base_belt_05: Tertiary
          mask_null: ""
