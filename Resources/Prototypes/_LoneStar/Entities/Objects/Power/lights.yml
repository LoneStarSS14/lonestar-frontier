- type: entity
  name: green floodlight
  id: FloodlightGreen
  parent: Floodlight
  description: A pole with powerful green lights on it.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/Misc/Lights/floodlight-green.rsi
    layers:
    - state: icon
      map: [ "base" ]
    - state: icon-on
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: Item
    sprite: _LoneStar/Objects/Misc/Lights/floodlight-green.rsi
    size: Normal
    heldPrefix: off
  - type: PointLight
    enabled: false
    color: "#00FF00"
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          FloodlightBrokenGreen:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  name: magenta floodlight
  id: FloodlightMagenta
  parent: Floodlight
  description: A pole with powerful magenta lights on it.
  components:
  - type: Sprite
