# Implementation of Hedera's double beds.
# The janky buckling when rotated north or south is the cost of having big beds. But it's Fine.

# The Base Double Bed
- type: entity
  parent: BaseStructure # Can't parent from Bed or they'll try to use bedsheets, as well as be unable to rotate.
  id: BaseDoubleBed
  abstract: true
  categories: [ HideSpawnMenu ]
  name: "double bed"
  description: "This is used to lie in, sleep in or strap to. Double the bed, double the fun!"
  components:
  - type: Sprite
    sprite: _Everdream/Structures/Furniture/doublebeds.rsi
    state: left
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,0.0,0.45,0.5"
        hard: false
        density: 190
        mask:
        - TableMask
  - type: InteractionOutline
  - type: Anchorable
  - type: Pullable

# Base Double Beds Left
- type: entity
  parent: BaseDoubleBed
  id: DoubleBedLeft
  suffix: Left
  components:
  - type: Sprite
    state: left
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: "0, -0.25"
  - type: PlaceableSurface
    placeCentered: true
    positionOffset: "0, -0.25"

# Base Double Beds Right
- type: entity
  parent: BaseDoubleBed
  id: DoubleBedRight
  suffix: Right
  components:
  - type: Sprite
    state: right
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: "0, 0.35" 
  - type: PlaceableSurface
    placeCentered: true
    positionOffset: "0, -0.35"

