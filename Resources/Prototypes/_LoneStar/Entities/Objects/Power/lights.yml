- type: entity #LoneStar adds green lantern for colorblind accessiblity
  name: green lantern
  parent: [BaseItem, RecyclableItemDeviceSmall] # Frontier: added RecyclableItemDeviceSmall
  id: LanternGreen
  description: The holy green light guides the way.
  components:
  - type: HandheldLight
    addPrefix: true
    blinkingBehaviourId: blinking
    radiatingBehaviourId: radiating
  - type: LightBehaviour
    behaviours:
    - !type:FadeBehaviour
      id: radiating
      maxDuration: 2.0
      startValue: 3.0
      endValue: 2.0
      isLooped: true
      reverseWhenFinished: true
    - !type:PulseBehaviour
      id: blinking
      interpolate: Nearest
      maxDuration: 1.0
      startValue: 0.1 # Wizden#37444
      endValue: 2.0 # Wizden#37444
      isLooped: true
  - type: Sprite
    sprite: Objects/Tools/lantern.rsi
    color: "#73FF73"
    layers:
    - state: lantern
    - state: lantern-on
      shader: unshaded
      visible: false
      map: [ "light" ]
  - type: Item
    sprite: Objects/Tools/lantern.rsi
    heldPrefix: off
  - type: PointLight
    enabled: false
    radius: 4
    energy: 3
    color: "#00FF00"
    netsync: false
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: light
  - type: ItemTogglePointLight
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
  - type: StealTarget
    stealGroup: LAMP
  - type: Clothing
    sprite: Objects/Tools/lantern.rsi
    equippedPrefix: off
    quickEquip: false
    slots:
    - Belt
  - type: Tag
    tags:
    - Flashlight

