# Stained Glass Windows by KC

- type: entity
  id: BaseStainedGlass
  parent: BaseStructure
  name: stained glass
  abstract: true
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _LoneStar/Structures/Wallmounts/stainedglass.rsi
    state: pinkcat
  - type: InteractionOutline
  - type: Appearance
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
  - type: PointLight
    radius: 3
    energy: 5
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
  - type: RCDDeconstructable
    cost: 3
    delay: 2
    fx: EffectRCDDeconstruct2

