
#region Colorable Bases
- type: entity # for sprites with a single colored layer
  abstract: true
  id: ClothingHeadRandomSpriteMono
  suffix: Random
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "head-icon" ]
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        map: [ "head-equipped" ]
  - type: ColorableClothing
    denyReroll: false
    available:
      - head-icon:
          icon: Base
        head-equipped:
          equipped-HELMET: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a set layer, and a single colored layer
  abstract: true
  parent: ClothingHeadRandomSpriteMono
  id: ClothingHeadRandomSpriteBaseColor
  suffix: Random
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-color
      map: [ "head-icon" ]
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
      - state: equipped-HELMET-color
        map: [ "head-equipped" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - head-icon:
          icon-color: Base
        head-equipped:
          equipped-HELMET-color: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a set layer, and a single colored layer, supporting inhands
  abstract: true
  parent: ClothingHeadRandomSpriteBaseColor
  id: ClothingHeadRandomSpriteBaseColorInhand
  suffix: Random
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      - state: inhand-left-color
        map: [ "hl-color" ]
      right:
      - state: inhand-right
      - state: inhand-right-color
        map: [ "hr-color" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - head-icon:
          icon-color: Base
        head-equipped:
          equipped-HELMET-color: Base
        hl-color:
          inhand-left-color: Base
        hr-color:
          inhand-right-color: Base
    mappedColors:
      Base: NTInteriorDesign

- type: entity # for sprites with a 2 colored layers
  abstract: true
  id: ClothingHeadRandomSpriteDualColor
  suffix: Random
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "head-icon-primary" ]
    - state: icon-color
      map: [ "head-icon-secondary" ]
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        map: [ "head-equipped-primary" ]
      - state: equipped-HELMET-color
        map: [ "head-equipped-secondary" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - head-icon-primary:
          icon: Primary
        head-icon-secondary:
          icon-color: Secondary
        head-equipped-primary:
          equipped-HELMET: Primary
        head-equipped-secondary:
          equipped-HELMET-color: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a 2 colored layers, supporting inhands
  abstract: true
  parent: ClothingHeadRandomSpriteDualColor
  id: ClothingHeadRandomSpriteDualColorInhand
  suffix: Random
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        map: [ "hl-primary" ]
      - state: inhand-left-color
        map: [ "hl-secondary" ]
      right:
      - state: inhand-right
        map: [ "hr-primary" ]
      - state: inhand-right-color
        map: [ "hr-secondary" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - head-icon-primary:
          icon: Primary
        head-icon-secondary:
          icon-color: Secondary
        head-equipped-primary:
          equipped-HELMET: Primary
        head-equipped-secondary:
          equipped-HELMET-color: Secondary
        hl-primary:
          inhand-left: Primary
        hl-secondary:
          inhand-left-color: Secondary
        hr-primary:
          inhand-right: Primary
        hr-secondary:
          inhand-right-color: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign
