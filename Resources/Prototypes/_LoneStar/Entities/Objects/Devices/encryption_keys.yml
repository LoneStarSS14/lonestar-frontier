  id: EncryptionKeyGuildLeader
  name: guild leader encryption key
  suffix: DO NOT MAP
  description: An encryption key for the sectors guild leader.
  components:
  - type: EncryptionKey
    channels:
    - Common
    - Traffic
    - Medical
    - Supply
    - Command
    defaultChannel: Common
  - type: Item
    sprite: _NF/Objects/Devices/encryption_keys.rsi
  - type: Sprite
