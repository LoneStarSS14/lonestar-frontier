#region tier 4 (boss)
- type: entity
  parent: NFBaseNpcLootWalletMercenary
  id: ClothingWalletMercenaryBoss
  categories: [ HideSpawnMenu ]
  components:
  - type: SpawnItemsOnUse
    items:
    # SpaceCash - from 1500 to 2500
    - id: SpaceCashRandom2500To7500
      orGroup: SpaceCash
    # BossLoot
    - id: SpawnDungeonLootNpcCoins # from 75 to ~5000 spesos
      orGroup: BossLoot
      prob: 0.3
    - id: SpawnDungeonLootNpcJewelry # from 10 to 5000 spesos
      orGroup: BossLoot
      prob: 0.3

