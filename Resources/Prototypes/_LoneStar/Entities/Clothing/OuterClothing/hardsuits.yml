# region hardsuits
- type: entity
  parent: NFClothingOuterEVASuitBase
  id: ClothingOuterHardsuitResponseRed
  name: CSI-128X Response hardsuit
  description: Designed with medical response in mind, a lightweight hardsuit with minimal protection, it feels like you're wearing nothing at all.
  components:
  - type: Sprite
    sprite: _Omu/Clothing/OuterClothing/Hardsuits/cybersunscientisthardsuit.rsi
  - type: Appearance
  - type: Clothing
    sprite: _Omu/Clothing/OuterClothing/Hardsuits/cybersunscientisthardsuit.rsi
    clothingVisuals:
      head:
      - state: equipped-OUTERCLOTHING
      head-harpy:
      - state: equipped-OUTERCLOTHING-harpy
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetResponseRed
  - type: ClothingSpeedModifier
    walkModifier: 1.0
    sprintModifier: 0.95
  - type: HeldSpeedModifier
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.7
        Heat: 0.8
        Radiation: 0.25
        Caustic: 0.25
  - type: GroupExamine
  - type: ItemToggle
    onUse: false
    soundActivate:
      path: /Audio/Items/flashlight_on.ogg
    soundDeactivate:
      path: /Audio/Items/flashlight_off.ogg
  - type: ItemToggleActiveSound
    activeSound:
      path: /Audio/_Omu/Effects/Vehicle/ambulancesiren2.ogg
      params:
        volume: -4
  - type: UseDelay
    delay: 1.0
  - type: ToggleClothing
    action: ActionToggleResponseSuitRed
  - type: ItemTogglePointLight
  - type: PointLight
    enabled: false
    radius: 2
    energy: 2
    color: red
    mask: /Textures/Effects/LightMasks/double_cone.png
  - type: RotatingLight
    speed: 270
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:ContainerSlot {}
      storagebase: !type:Container
        ents: []

