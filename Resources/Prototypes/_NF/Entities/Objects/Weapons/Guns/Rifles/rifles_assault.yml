#region WizDen
- type: entity # TODO: switch to .25 rifle (caseless)
  id: NFWeaponRifleAssaultSm
  parent: [ NFBaseWeaponRifleAssaultChamber30, NFBaseWeaponFrameRifleAssaultCybersun ]
  name: Soland-Moss # Renamed: real brand name
  description: |-
    An iconic weapon of war. An illegal firearm often used by Syndicate agents.
  components:
  - type: Clothing
    sprite: _NF/Objects/Weapons/Guns/Rifles/solandmoss.rsi
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Rifles/solandmoss.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: true

- type: entity
  id: NFWeaponRifleAssaultEstoc
  parent: [NFBaseWeaponRifleAssaultChamber20, NFBaseWeaponFrameRifleAssaultCybersun]
  name: Estoc DMR
  description: "A designated marksman rifle firing in 3-round bursts. The Estoc was designed as the Lecter’s long-range counterpart, equipped with an extended 20-inch barrel and telescopic sight.\nFeeds from .20 rifle magazines."
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Rifles/estoc.rsi
  - type: Clothing
    sprite: Objects/Weapons/Guns/Rifles/estoc.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/estocshot.ogg
    availableModes:
    - Burst
    - SemiAuto
    selectedMode: Burst
    shotsPerBurst: 3
    burstFireRate: 14
    burstCooldown: 1
  - type: SpeedModifiedOnWield
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.2

- type: entity # TODO: switch to .25 rifle (caseless)
  id: NFWeaponRifleAssaultM90GrenadeLauncher
  parent: [ NFBaseWeaponRifleAssaultChamber20, NFBaseWeaponFrameRifleAssaultCybersun ]
  name: M-90 carbine # LoneStar
  description: "An older bullpup carbine model, long discarded by modern militaries for more conventional and cheaper rifles. An old standby often used by Syndicate agents when resupply is uncertain." # LoneStar
  components:
  - type: Clothing
    sprite: _LoneStar/Objects/Weapons/Guns/Rifles/m90.rsi # LoneStar
  - type: Sprite
    sprite: _LoneStar/Objects/Weapons/Guns/Rifles/m90.rsi # LoneStar

- type: entity
  id: NFWeaponRifleAssaultLecter
  parent: [ BaseC2ContrabandUnredeemable, NFBaseWeaponRifleAssaultChamber20, NFBaseWeaponFrameRifleAssaultNanotrasen ]
  name: Lecter
  description: |-
    A medium end military grade assault rifle. On the receiver is a label that says 'for authorized use only.'
  components: &lecterComponents
  - type: Clothing
    sprite: _NF/Objects/Weapons/Guns/Rifles/lecter.rsi
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Rifles/lecter.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: true
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ltrifle.ogg

