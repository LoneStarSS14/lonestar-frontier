- type: job
  id: LSEscort
  name: job-name-ls-escort
  description: job-description-ls-escort
  supervisors: job-supervisors-ls-master-at-arms
  playTimeTracker: JobLSEscort
  weight: 10
  displayWeight: 10
  # TODO section
  startingGear: LSEscortGear
  icon: "JobIconBoxer"
  # Frontier's fields
  hideConsoleVisibility: true
  newPlayerMessage: false
  # Uncertain if needed
  alwaysUseSpawner: true
  consoleAdjustable: false
  # Common v
  access:
  - Pirate
  accessGroups:
  - GeneralAccess
  special:
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
  #freelancer specific
  - !type:AddComponentSpecial
    components:
    - type: IsPirate # TODO: Rename this to IsFreelancer
  - !type:AddImplantSpecial
    implants: [ FreelanceTrackingImplant ]
  #RPI
  - !type:AddRpiJobModifierSpecial
    modifiersToAdd:
    - rpiJobModifierPirate
  - !type:AddRpiAuraSpecial
    aurasToAdd:
    - rpiAuraMassageTherapist # TODO: replace this
  - !type:RpiChatJudgementModifierSpecial
    modsToAdd:
    - rpiChatJudgementModifierMassageTherapist # TODO: replace this

- type: entity
  id: SpawnPointLSEscort # TODO: mapping migrations.
  parent: SpawnPointJobBase
  name: escort spawn point
  suffix: LoneStar
  components:
  - type: SpawnPoint
    job_id: LSEscort
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner-red

- type: startingGear
  id: LSEscortGear
  equipment: # TODO: add PDA
    pocket1: ContrabandAppraisalToolPirate

- type: roleLoadout
  id: JobLSEscort
  canCustomizeName: true
  groups:
  # Unique v
  - LSFreelancerEscortPDA
  # Freelancer v
  - LSFreelancersFactionJumpsuit
  - LSFreelancersFactionOuterClothing
  - LSFreelancersFactionShoes
  - LSFreelancersFactionGloves
  - LSFreelancersFactionHead
  - LSFreelancersFactionMask
  - LSFreelancersFactionEyes
  - LSFreelancersFactionNeck
  - LSFreelancersFactionEars
  - LSFreelancersFactionBackpack
  - LSFreelancersFactionBelt
  - LSFreelancersFactionWallet
  - LSFreelancersFactionEncryptionKey
  - LSFreelancersFactionImplanter
  # Common v
  - ContractorBoxSurvival
  - ContractorCartridge
  - ContractorBackpackItems
  - ContractorHandItems
  - ContractorInstruments
  - NFSpeciesSpecific
