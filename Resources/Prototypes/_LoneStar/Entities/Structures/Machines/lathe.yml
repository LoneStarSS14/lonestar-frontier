# Generalized magnet for lathes.
- type: entity
  abstract: true
  id: BaseLatheMagnet
  components:
  - type: MaterialStorageMagnetPickup
    range: 0.30

# Biogen for service ships
- type: entity
  id: BioDjinn
  parent: Biogenerator
  name: Bio Djinn
  description: An advanced biogenerator that synthesizes raw biomass from... somewhere, which it can then assemble into more complex organic forms. Or soda.
  components:
  - type: Machine
    board: BioDjinnMachineCircuitboard
  - type: BiogeneratorBuffer
    current: 0
    max: 200
    regenAmount: 5
    regenInterval: 15 # just for bootstrapping
  - type: Sprite
    sprite: _LoneStar/Structures/Machines/Lathes/biodjinn.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: beaker
      map: ["beaker"]
      visible: false

- type: entity
  id: BioDjinnFill
  parent: BioDjinn
  name: Bio Djinn
  suffix: Biomass, 200
  components:
  - type: MaterialStorage
    storage:
      Biomass: 200
  - type: ContainerFill
    containers:
      beaker_slot:
      - LargeBeaker
