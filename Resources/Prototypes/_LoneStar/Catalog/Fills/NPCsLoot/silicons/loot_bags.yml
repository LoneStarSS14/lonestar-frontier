#region Tier 0 (asteroid)
- type: entity
  parent: MarkerBasePlaceFree
  id: LSSpawnLootRogueSiliconT0
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTableSpawner
    offset: 0.25
    table: !type:AllSelector
      children:
      - !type:GroupSelector # Scrap
        children:
        - id: ScrapOreRandomVeryLow
          orGroup: Scrap
          prob: 0.8
        - id: ScrapOreTechRandomVeryLow
          orGroup: Scrap
          prob: 0.2
      - !type:GroupSelector # Loot
        children:
        - id: SpawnDungeonLootNpcMaterialRandom
          weight: 4
        - id: SpawnDungeonLootNpcRogueSiliconTreasure
          prob: 5

