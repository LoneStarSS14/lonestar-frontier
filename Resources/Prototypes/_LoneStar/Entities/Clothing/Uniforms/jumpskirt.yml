# region School skirts
- type: entity
  parent: ClothingUniformJumpskirtSchool
  id: ClothingUniformJumpskirtSchoolOrange
  name: school skirt (nectarine)
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-detail
      color: "#ff9100"
    - state: icon-accent
      color: "#6567ff"
  - type: Clothing
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
      - state: equipped-INNERCLOTHING-detail
        color: "#ff9100"
      - state: equipped-INNERCLOTHING-accent
        color: "#6567ff"
      jumpsuit-monkey:
      - state: equipped-INNERCLOTHING
      - state: equipped-INNERCLOTHING-detail
        color: "#ff9100"
      - state: equipped-INNERCLOTHING-accent
        color: "#6567ff"
  - type: Item
    inhandVisuals:
      left:
        - state: inhand-left
        - state: inhand-left-detail
          color: "#ff9100"
      right:
        - state: inhand-right
        - state: inhand-right-detail
          color: "#ff9100"

