        map: [ "hl-color" ]
      right:
      - state: inhand-right
      - state: inhand-right-color
        map: [ "hr-color" ]
  - type: ColorableClothing
    available:
      - neck-icon:
          icon-color: Base
        neck-equipped:
          equipped-NECK-color: Base
        hl-color:
          inhand-left-color: Base
        hr-color:
          inhand-right-color: Base
    mappedColors:
