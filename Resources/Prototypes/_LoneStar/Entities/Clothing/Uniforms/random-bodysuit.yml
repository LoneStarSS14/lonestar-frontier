# Base
- type: entity
  parent: ClothingUniformBase
  id: BaseClothingUniformBodysuitRandom
  abstract: true
  name: random bodysuit
  description: Generated by neural networks based on the latest fashion trends.
  suffix: Random visual
  components:
  - type: SuitSensor
  - type: Sprite
    sprite: _LoneStar/Clothing/Uniforms/random-bodysuit.rsi
    layers:
    - state: torso_plain
      map: [ "base" ]
    - state: legs_plain
      map: [ "leg" ]
    - state: mask_null
      map: [ "decor" ]
    - state: mask_null
      map: [ "cuffs" ]
  - type: Clothing
    sprite: _LoneStar/Clothing/Uniforms/random-bodysuit.rsi
    clothingVisuals:
      jumpsuit:
      - state: torso_plain
        map: [ "base" ]
      - state: legs_plain
        map: [ "leg" ]
      - state: mask_null
        map: [ "decor" ]
      - state: mask_null
        map: [ "cuffs" ]

# Spawner
- type: entity
  parent: BaseClothingUniformBodysuitRandom
  id: ClothingUniformBodysuitRandomSpawner
  name: random bodysuit spawner
  components:
  - type: RandomSpawner
    offset: 0
    prototypes:
    - ClothingUniformBodysuitRandom
    - ClothingUniformBodysuitRandomSwimsuit
    - ClothingUniformBodysuitRandomLeotard
    - ClothingUniformBodysuitRandomDealer
    - ClothingUniformBodysuitRandomClown

