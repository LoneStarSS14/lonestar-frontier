    price: 100
  - type: Advertise
    pack: SlotMachineAds
  - type: ClawMachine
    winChance: 0.15
    rewards:
    - PrizeBallSmall
    - PrizeBallSmall
    - PrizeBallSmall
    - PrizeBall
    evilRewards: # ~4% chance to get a syndie ball each attempt at the machine
