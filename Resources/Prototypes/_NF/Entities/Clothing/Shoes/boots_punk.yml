
- type: entity
  id: ClothingShoesBootsPunkRandomized
  parent: [ ClothingShoesMilitaryBase, RecyclableItemClothSmall ]
  name: punk boots
  description: Deez boots were made for stompin', an' stompin' on ya bucket dey'll do.
  suffix: Random visuals
  components:
  - type: Sprite
    sprite: _NF/Clothing/Shoes/Boots/punk.rsi
    layers:
    - state: icon_base_boots_01
      map: [ "boots_main" ]
    - state: icon_decor_base_boots_01
      map: [ "boots_decor" ]
  - type: Clothing
    sprite: _NF/Clothing/Shoes/Boots/punk.rsi
    clothingVisuals:
      shoes:
      - state: base_boots_01
        map: [ "clothing_boots_main" ]
      - state: mask_null
        map: [ "clothing_boots_decor" ]
      - state: mask_null
        map: [ "clothing_boots_overlay" ]
        shader: unshaded # LoneStar
  - type: ColorableClothing # LoneStar
    denyReroll: false
    mappedColors:
      Primary: Cyberpunk
      Secondary: Cyberpunk
      Tertiary: CyberpunkNeon
    available:
    - boots_main:
        icon_base_boots_01: Primary
      clothing_boots_main:
        base_boots_01: Primary
      boots_decor:
        icon_decor_base_boots_01: Secondary
      clothing_boots_decor:
        decor_base_boots_01: Secondary
      clothing_boots_overlay:
        decor_base_boots_02: Tertiary
        mask_null: ""
