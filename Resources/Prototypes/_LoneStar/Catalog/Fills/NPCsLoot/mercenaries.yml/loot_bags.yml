#region Bosses
- type: entity
  parent: MarkerBasePlaceFree
  id: LSSpawnLootMercenaryLootBoss
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTableSpawner
    offset: 0.25
    table: !type:AllSelector
      children:
      - !type:GroupSelector # Weapon
        children:
        - !type:AllSelector
          weight: 2
          children:
          - id: LSWeaponRifleMahifa
          - !type:GroupSelector
            children:
            - id: NFAmmunitionBoxRifle30Overpressure
              weight: 4
            - id: NFAmmunitionBoxBigRifle30Overpressure
              weight: 1
            rolls: !type:RangeNumberSelector
              range: 1, 2
        - !type:AllSelector
          children:
          - !type:GroupSelector
            children:
            - !type:NestedSelector
              weight: 22
              tableId: LSTableGeneralWeaponRangedT3
            - !type:NestedSelector
              weight: 7
              tableId: LSTableGeneralWeaponRangedT4
          - !type:NestedSelector
            tableId: LSTableGeneralWeaponAmmoOverpressureAny
            rolls: !type:RangeNumberSelector
              range: 2, 3
        - !type:GroupSelector
          children:
          - !type:NestedSelector
            weight: 22
            tableId: LSTableGeneralWeaponMeleeT3
          - !type:NestedSelector
            weight: 7
            tableId: LSTableGeneralWeaponMeleeT4
      - id: ClothingOuterHardsuitScaf # Armor
        prob: 0.4
      - !type:AllSelector # Blueprints
        children:
        - !type:NestedSelector
          tableId: LSTableMercenaryBlueprint
        - !type:NestedSelector
          tableId: LSTableMercenaryBlueprint
          prob: 0.3
