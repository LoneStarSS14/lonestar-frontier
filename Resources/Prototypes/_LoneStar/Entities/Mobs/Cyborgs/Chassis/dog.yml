
- type: entity
  id: DogBorgChassisSelectable
  parent: BorgChassisSelectable
  abstract: true

- type: entity
  id: DogBorgChassisEngineer
  parent: DogBorgChassisSelectable
  name: engineer dogborg
  components:
  - type: BorgSwitchableType
    selectedBorgType: DogEngineering
  - type: Sprite
    sprite: _LoneStar/Entities/Mobs/Silicon/Cyborg/dog.rsi
    layers:
    - state: engineeringd
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: engineeringd_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: engineeringd_l
      shader: unshaded
      map: ["light","enum.BorgVisualLayers.LightStatus"]
      visible: false

