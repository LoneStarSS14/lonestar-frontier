#region colorable
- type: entity
  parent: [ ClothingUniformSkirtBase, ClothingUniformColorableBaseColorInhand ]
  id: ClothingUniformTurtleskirtColorable
  name: turtleneck jumpskirt
  description: For some reason, wearing this makes you feel like working in tech support at a product store.
  components:
  - type: Sprite
    sprite: _LoneStar/Clothing/Uniforms/Jumpskirt/color_turtle.rsi
    layers: # TODO: add support for sprite+clothing mappings to keep layers sync'd and revert this to icons.
    - state: equipped-INNERCLOTHING-color
      map: [ "uniform-equipped" ]
    - state: equipped-INNERCLOTHING
      map: [ "uniform-equipped-skirt" ]
  - type: Clothing
    sprite: _LoneStar/Clothing/Uniforms/Jumpskirt/color_turtle.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING-color
        map: [ "uniform-equipped" ]
      - state: equipped-INNERCLOTHING
        map: [ "uniform-equipped-skirt" ]
  - type: ColorableClothing
    available:
      - uniform-icon:
          icon-color: Base
        uniform-equipped-skirt:
          equipped-INNERCLOTHING: ""
          equipped-INNERCLOTHING-long: ""
          equipped-INNERCLOTHING-pencil: ""
          equipped-INNERCLOTHING-poofy: ""
        uniform-equipped:
          equipped-INNERCLOTHING-color: Base
        hl-color:
          inhand-left-color: Base
        hr-color:
          inhand-right-color: Base

- type: entity
  parent: ClothingUniformSkirtBase
  id: ClothingUniformJumpskirtTailoredGownColorable
  name: tailored gown
  components:
  - type: Sprite
    sprite: _LoneStar/Clothing/Uniforms/Jumpskirt/tailored-gown.rsi
    layers:
    - state: icon-base
      map: [ "icon-base" ]
    - state: icon-decor
      map: [ "icon-decor" ]
    - state: icon-accent
      map: [ "icon-accent" ]
    - state: icon-extra
      map: [ "icon-extra" ]
  - type: Clothing
    sprite: _LoneStar/Clothing/Uniforms/Jumpskirt/tailored-gown.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING-base
        map: [ "base" ]
      - state: equipped-INNERCLOTHING-decor
        map: [ "decor" ]
      - state: equipped-INNERCLOTHING-accent
        map: [ "accent" ]
      - state: equipped-INNERCLOTHING-extra
        map: [ "extra" ]
  - type: ColorableClothing
    denyReroll: false
    mappedColors:
        Silks: LSSilks
        Primary: NTInteriorDesign
        Secondary: NTInteriorDesign
        Gems: TechniColors
    available:
      - base:
          equipped-INNERCLOTHING-base: Primary
        decor:
          equipped-INNERCLOTHING-decor: Secondary
        accent:
          equipped-INNERCLOTHING-accent: Silks
        extra:
          equipped-INNERCLOTHING-extra: Gems
        icon-base:
          icon-base: Primary
        icon-decor:
          icon-decor: Secondary
        icon-accent:
          icon-accent: Silks
        icon-extra:
          icon-extra: Gems

