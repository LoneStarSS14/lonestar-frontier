  - type: Item
    heldPrefix: pompette
  - type: Food
    requiresSpecialDigestion: true
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 50
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Fiber
          Quantity: 10
        - ReagentId: Wine
          Quantity: 10
