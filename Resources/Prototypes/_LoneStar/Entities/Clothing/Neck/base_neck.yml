        neck-equipped-secondary:
          equipped-NECK-color: Secondary
        hl-primary:
          inhand-left: Primary
        hl-secondary:
          inhand-left-color: Secondary
        hr-primary:
          inhand-right: Primary
        hr-secondary:
          inhand-right-color: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign
