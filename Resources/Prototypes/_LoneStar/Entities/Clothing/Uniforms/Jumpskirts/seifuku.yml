#region Base
- type: entity
  parent: ClothingUniformSkirtBase
  id: ClothingUniformBaseJumpskirtSeifuku
  abstract: true
  name: seifuku
  description: An old terran styled outfit, bread not included.
  components:
  - type: Sprite
    sprite: _LoneStar/Clothing/Uniforms/Jumpskirt/seifuku.rsi
    layers:
    - state: icon-primary
      map: [ "i-primary" ]
    - state: icon-secondary
      map: [ "i-secondary" ]
    - state: icon-tertiary
      map: [ "i-tertiary" ]
  - type: Clothing
    sprite: _LoneStar/Clothing/Uniforms/Jumpskirt/seifuku.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING-primary
        map: [ "uniform-primary" ]
      - state: equipped-INNERCLOTHING-secondary
        map: [ "uniform-secondary" ]
      - state: equipped-INNERCLOTHING-tertiary
        map: [ "uniform-tertiary" ]
  - type: Item
    inhandVisuals:
      left:
        - state: inhand-left-primary
          map: [ "hl-primary" ]
        - state: inhand-left-secondary
          map: [ "hl-secondary" ]
        - state: inhand-left-tertiary
          map: [ "hl-tertiary" ]
      right:
        - state: inhand-right-primary
          map: [ "hr-primary" ]
        - state: inhand-right-secondary
          map: [ "hr-secondary" ]
        - state: inhand-right-tertiary
          map: [ "hr-tertiary" ]
  - type: ColorableClothing
    randomOnCreation: false
    mappedColors:
      Shirt: LSSilks
      Dress: NTInteriorDesign
      Ribbon: NTInteriorDesign
    available:
      - i-primary:
          icon-primary: Shirt
        i-secondary:
          icon-secondary: Dress
        i-tertiary:
          icon-tertiary: Ribbon
        uniform-primary:
          equipped-INNERCLOTHING-primary: Shirt
        uniform-secondary:
          equipped-INNERCLOTHING-secondary: Dress
        uniform-tertiary:
          equipped-INNERCLOTHING-tertiary: Ribbon
        hl-primary:
          inhand-left-primary: Shirt
        hl-secondary:
          inhand-left-secondary: Dress
        hl-tertiary:
          inhand-left-tertiary: Ribbon
        hr-primary:
          inhand-right-primary: Shirt
        hr-secondary:
          inhand-right-secondary: Dress
        hr-tertiary:
          inhand-right-tertiary: Ribbon

#region Randomized
- type: entity
  parent: ClothingUniformBaseJumpskirtMaidUniform2Tone
  id: ClothingUniformJumpskirtSeifukuRandom
  components:
  - type: ColorableClothing
    randomOnCreation: true

