## LoneStar, file changed heavily to support colorable clothing.
## Color of black shoe lines changed to match worn state, same for brown.
## Parents changed to lead to black shoes to remove specifying the sprite over and over

# DO NOT ARBITRARILY CHANGE THESE TO MAKE THEM "CONSISTENT" WITH THE COLOR JUMPSUITS. You are probably just going to make them look worse. # LoneStar, yo calm down...

# Black Shoes
- type: entity
  parent: [ ClothingShoesBaseButcherable, ClothingShoesColorableBaseColorInhand ]
  id: ClothingShoesColorBlack
  name: black shoes
  description: Stylish black shoes.
  components:
  - type: Sprite
    sprite: _LoneStar/Clothing/Shoes/color.rsi
    layers:
    - state: icon-color
      color: "#1d1d1d"
      map: [ "shoes-icon" ]
    - state: icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-color
        color: "#1d1d1d"
        map: [ "hl-color" ]
      - state: inhand-left
      right:
      - state: inhand-right-color
        color: "#1d1d1d"
        map: [ "hr-color" ]
      - state: inhand-right
  - type: Clothing
    sprite: _LoneStar/Clothing/Shoes/color.rsi
    clothingVisuals:
      shoes:
      - state: equipped-FEET-color
        color: "#1d1d1d"
        map: [ "shoes-equipped" ]
      - state: equipped-FEET
  - type: ColorableClothing
    randomOnCreation: false

