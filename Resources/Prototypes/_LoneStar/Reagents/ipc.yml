          min: 11
      - !type:HealthChange
        damage:
          types:
            Blunt: 0.75
            Piercing: 0.75
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "generic-reagent-effect-burning-insides" ]
        probability: 0.33
    Synthetic:
      effects:
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages: [ "generic-reagent-effect-prickle" ]
        probability: 0.33
      - !type:HealthChange
        damage:
          groups:
            Brute: -3
            Burn: -2
          types:
            Radiation: -0.5
            Bloodloss: -0.5
        conditions:
        - !type:ReagentThreshold
          max: 11
      - !type:Emote
        emote: Scream
        probability: 0.1
      - !type:MovespeedModifier
        statusLifetime: 1.5
        walkSpeedModifier: 0.4
        sprintSpeedModifier: 0.4
      - !type:GenericStatusEffect
        key: TemporaryBlindness
        component: TemporaryBlindness
        time: 2
        refresh: true
      - !type:AdjustReagent
        reagent: Sylenone
        amount: 0.25

