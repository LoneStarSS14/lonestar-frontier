  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
      - state: equipped-HELMET-color
        map: [ "head-equipped" ]
  - type: ColorableClothing
    available:
      - head-icon:
          icon-color: Base
        head-equipped:
          equipped-HELMET-color: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a set layer, and a single colored layer, supporting inhands
  abstract: true
  parent: ClothingHeadColorableBaseColor
  id: ClothingHeadColorableBaseColorInhand
  suffix: Colorable
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      - state: inhand-left-color
        map: [ "hl-color" ]
      right:
      - state: inhand-right
      - state: inhand-right-color
        map: [ "hr-color" ]
  - type: ColorableClothing
    available:
      - head-icon:
          icon-color: Base
        head-equipped:
          equipped-HELMET-color: Base
        hl-color:
          inhand-left-color: Base
        hr-color:
          inhand-right-color: Base
    mappedColors:
      Base: NTInteriorDesign

- type: entity # for sprites with a 2 colored layers
  abstract: true
  id: ClothingHeadColorableDualColor
  suffix: Colorable
  components:
  - type: Sprite
    layers:
    - state: icon-primary
      map: [ "head-icon-primary" ]
    - state: icon-secondary
      map: [ "head-icon-secondary" ]
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET-primary
        map: [ "head-equipped-primary" ]
      - state: equipped-HELMET-secondary
        map: [ "head-equipped-secondary" ]
  - type: ColorableClothing
    available:
      - head-icon-primary:
          icon-primary: Primary
        head-icon-secondary:
          icon-secondary: Secondary
        head-equipped-primary:
          equipped-HELMET-primary: Primary
        head-equipped-secondary:
          equipped-HELMET-secondary: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a 2 colored layers, supporting inhands
  abstract: true
  parent: ClothingHeadColorableDualColor
  id: ClothingHeadColorableDualColorInhand
  suffix: Colorable
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-primary
        map: [ "hl-primary" ]
      - state: inhand-left-secondary
        map: [ "hl-secondary" ]
      right:
      - state: inhand-right-primary
        map: [ "hr-primary" ]
      - state: inhand-right-secondary
        map: [ "hr-secondary" ]
  - type: ColorableClothing
    available:
      - head-icon-primary:
          icon-primary: Primary
        head-icon-secondary:
          icon-secondary: Secondary
        head-equipped-primary:
          equipped-HELMET-primary: Primary
        head-equipped-secondary:
          equipped-HELMET-secondary: Secondary
        hl-primary:
          inhand-left-primary: Primary
        hl-secondary:
          inhand-left-secondary: Secondary
        hr-primary:
          inhand-right-primary: Primary
        hr-secondary:
          inhand-right-secondary: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign
