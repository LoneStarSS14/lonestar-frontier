- type: entity
  id: BannerNfsd
  parent: BannerBase
  name: LSRD banner # Lonestar changes NFSD -> LSRD
  description: A banner displaying the colors of the Lone Star Rangers Division.
  components:
  - type: Sprite
    sprite: _LoneStar/Structures/Decoration/banner.rsi
    state: lsrd-banner
  - type: Construction
    graph: BannersGraph
    node: BannerSecurityNode

- type: entity
  id: FlagNfsd
  parent: BannerBase
  name: LSRD flag # Lonestar changes NFSD -> LSRD
  description: A flag displaying the colors of the Lone Star Rangers Division.
  components:
  - type: Sprite
    sprite: _NF/Structures/Decoration/banner.rsi
    state: nfsd-flag
  - type: Construction
    graph: BannersGraph
    node: BannerSecurityNode

- type: entity
  id: BannerGoblin01
  parent: BannerBase
  name: goblin banner
