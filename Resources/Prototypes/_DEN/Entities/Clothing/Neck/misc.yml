#region Base
- type: entity
  parent: [ClothingNeckCollarBase, BaseFoldable]
  id: ClothingNeckCollarBaseFoldable
  abstract: true
  components:
  - type: Foldable
    canFoldInsideContainer: true
    foldVerbText: unfold-verb
    unfoldVerbText: fold-verb
  - type: FoldableClothing
    foldedEquippedPrefix: folded

#region Collars
- type: entity
  parent: ClothingNeckCollarBaseFoldable
  id: ClothingNeckCowBellCollar
  name: cowbell collar
  description: A way to inform others about the presence of livestock, or just to annoy everyone around you! Can be unfolded to appear thicker.
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Neck/Collars/collar_cowbell.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Neck/Collars/collar_cowbell.rsi
  - type: EmitsSoundOnMove
    soundCollection:
      collection: CowbellRings

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckVetCone
  name: Veterinary Cone
  description: Used for when a pet has an injury you dont want them to bite. Or a Felinid... Or a Canid... Or a Tajaran... Or a Vulpkanin... Or anyone really.
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Neck/Misc/vet-cone.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Neck/Misc/vet-cone.rsi
    equipDelay: 0.5
    unequipDelay: 10
    renderLayer: mask
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: SheetPlastic1
      amount: 1
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Oil
          Quantity: 2.5
        - ReagentId: Phosphorus
          Quantity: 2.5

- type: entity
  parent: ClothingNeckCollarBaseFoldable
  id: ClothingNeckSpikedCollar
  name: spiked collar
  description: A simple leather collar with decorative spikes.  Can be unfolded to appear thicker.
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Neck/Collars/collar_spiked.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Neck/Collars/collar_spiked.rsi
