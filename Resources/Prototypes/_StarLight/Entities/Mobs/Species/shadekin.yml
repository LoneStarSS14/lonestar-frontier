- type: entity
  save: false
  name: Urist McShadow
  parent:
  - MobBloodstream
  - MobAtmosStandard
  - MobFlammable
  - BaseMobSpecies
  id: BaseMobShadekin
  abstract: true
  components:
  - type: Carriable # Wayfarer
  - type: Inventory
    speciesId: shadekin
  - type: Needs # LoneStar, we dont have hunger/thirst
    needs:
    - NeedHungerDefault
    - NeedThirstDefault
  - type: HumanoidAppearance
    species: Shadekin
  - type: Icon
    sprite: _Starlight/Mobs/Species/Shadekin/parts.rsi
    state: full
  - type: Body
    prototype: Shadekin
    requiredLegs: 2
  - type: Speech
    allowedEmotes: ["Marr", "Wurble", "Hisses", "Growl", "Purr"]
  - type: Vocal
    sounds:
      Male: MaleShadekin
      Female: FemaleShadekin
      Unsexed: MaleShadekin
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcClaw
    damage:
      types:
        Slash: 5
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Shadekin
  - type: Deathgasp
  - type: Reactive
    groups:
      Flammable: [Touch]
      Extinguish: [Touch]
      Acidic: [ Touch, Ingestion ]
    reactions:
      - reagents: [Water, SpaceCleaner]
        methods: [Touch]
        effects:
          - !type:WashCreamPieReaction # Wayfarer: WashCreampie<WashCreampieReaction
          - !type:Emote
            emote: Hisses
            showInChat: false
  - type: Bloodstream
    bloodlossDamage:
      types:
        Bloodloss: 1
    bloodlossHealDamage:
      types:
        Bloodloss: -0.25
    bloodReagent: DarkBlood # Wayfarer: Wait for upstream to use bloodReferenceSolution
    # Wayfarer
      # reagents:
      #   - ReagentId: DarkBlood
      #     Quantity: 300
    # End Wayfarer
  - type: Flammable
    damage:
      types:
        Heat: 1.5
  - type: TypingIndicator
    proto: alien
  # Below should have parity with BaseMobSpeciesOrganic
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.50
        Heat: 0.1
  - type: PassiveDamage
    allowedStates:
    - Alive
    damageCap: 20
    damage:
      types:
        Heat: -0.07
      groups:
        Brute: -0.07
  - type: Fingerprint
  - type: Blindable
  - type: Temperature
    heatDamageThreshold: 325
    coldDamageThreshold: 260
    currentTemperature: 310.15
    specificHeat: 42
    coldDamage:
      types:
        Cold: 0.1
    heatDamage:
      types:
        Heat: 1.5
  - type: TemperatureSpeed
    thresholds:
      293: 0.8
      280: 0.6
      260: 0.4
  # - type: Perishable # Coyote
  - type: ThermalRegulator
    metabolismHeat: 800
    radiatedHeat: 100
    implicitHeatRegulation: 500
    sweatHeatRegulation: 2000
    shiveringHeatRegulation: 2000
    normalBodyTemperature: 310.15
    thermalRegulationTemperatureThreshold: 2
  - type: Butcherable
    butcheringType: Spike
    spawned:
      - id: FoodMeat
        amount: 5
  - type: FireVisuals
    alternateState: Standing
  - type: LayingDown
  - type: ModifyUndies
  - type: RoleplayIncentive
