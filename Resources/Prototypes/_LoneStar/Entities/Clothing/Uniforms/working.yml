- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpskirtEnteraColorable
  name: tailored gown
  suffix: Random
  components:
  - type: Sprite
    sprite: _LoneStar/Clothing/Uniforms/entera.rsi
    layers:
    - state: icon-base
      map: [ "icon-base" ]
    - state: icon-decor
      map: [ "icon-decor" ]
    - state: icon-accent
      map: [ "icon-accent" ]
    - state: icon-extra
      map: [ "icon-extra" ]
  - type: Clothing
    sprite: _LoneStar/Clothing/Uniforms/entera.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING-base
        map: [ "base" ]
      - state: equipped-INNERCLOTHING-decor
        map: [ "decor" ]
      - state: equipped-INNERCLOTHING-accent
        map: [ "accent" ]
      - state: equipped-INNERCLOTHING-extra
        map: [ "extra" ]
  - type: RandomSprite
    denyReroll: false
    mappedColors:
        base: NTInteriorDesign
        decor: NTInteriorDesign
        accent: NTInteriorDesign
        extra: TechniColors
    available:
      - base:
          equipped-INNERCLOTHING-base: base
        decor:
          equipped-INNERCLOTHING-decor: decor
        accent:
          equipped-INNERCLOTHING-accent: accent
        extra:
          equipped-INNERCLOTHING-extra: extra
        icon-base:
          icon-base: base
        icon-decor:
          icon-decor: decor
        icon-accent:
          icon-accent: accent
        icon-extra:
          icon-extra: extra

