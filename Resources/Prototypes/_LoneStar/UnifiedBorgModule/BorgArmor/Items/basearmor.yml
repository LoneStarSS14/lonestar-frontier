# Note: THIS SHOULD NEVER SPAWN OR BE SPAWNED. It is a BASETYPE. Stats are irrelevant.
- type: entity
  parent: ClothingOuterArmorBase #Inherit all changes from this. Hopefully will prevent compatability issues in the future.
  id: SyntheticBorgArmorBase # Base Armor Type for borgs
  abstract: true
  components:
  - type: ArmorPlateItem
    maxDurability: 75
    walkSpeedModifier: 0.99
    sprintSpeedModifier: 0.99
    staminaDamageMultiplier: 0
    absorptionRatios:
      Piercing: 0.1
      Blunt: 0.1
      Slash: 0.1
      Heat: 0.1
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 250
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    sprite: _LoneStar/Objects/BorgArmor/physarmor/borglightarmor.rsi
  - type: Clothing
    sprite: _LoneStar/Objects/BorgArmor/physarmor/defaultarmor.rsi
    clothingVisuals:
      BORGARMOR:
      - state: on-equipped-BORGARMOR
        shader: unshaded
    quickEquip: false # Cannot be hot-swapped from bluespace bags. No, you cannot hot-swap from speed armor to heavy armor.
    slots:
    - BORGARMOR # No free NFSD tier armor for anyone who prints it.
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.7
        Piercing: 0.85
        Heat: 0.85
  - type: ClothingSpeedModifier  # Stacks with other slowdowns. Be careful!
    walkModifier: 1
    sprintModifier: 1
  - type: Tag
    tags:
    - BorgWearable # Required for all variants, as this is what controls wearability!
