  - type: EntityTableSpawner
    offset: 0.25
    table: !type:AllSelector
      children:
      - !type:AllSelector # Weapon
        children:
        - id: SpawnDungeonLootNpcSyndicateWeaponsRifles
          prob: 0.8
        - id: SpawnDungeonLootGunT3
          prob: 0.3
      - !type:GroupSelector # Armor
        children:
        - id: ClothingOuterHardsuitSyndieElite
          weight: 1
        - !type:NestedSelector
          weight: 14
          tableId: LSTableSyndicateArmor
