- type: entity
  parent: BaseWrappedPacket
  id: WrappedRustPackage
  name: sealed narcotic packet
  description: Worth a pretty penny, the liquid inside the vials looks oily.
  suffix: Rust
  components:
  - type: StaticPrice
    price: 5000
  - type: Sprite
    sprite: _CD/Objects/Misc/Contraband/drug_packets.rsi
    state: brown_icon
    color: "#D4A574"
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: OpenedRustPacket
      amount: 1

