    layers:
    - state: icon
      map: [ "neck-icon-primary" ]
    - state: icon-color
      map: [ "neck-icon-secondary" ]
  - type: Clothing
    clothingVisuals:
      neck:
      - state: equipped-NECK
        map: [ "neck-equipped-primary" ]
      - state: equipped-NECK-color
        map: [ "neck-equipped-secondary" ]
  - type: ColorableClothing
    available:
      - neck-icon-primary:
          icon: Primary
        neck-icon-secondary:
          icon-color: Secondary
        neck-equipped-primary:
          equipped-NECK: Primary
        neck-equipped-secondary:
          equipped-NECK-color: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a 2 colored layers, supporting inhands
  abstract: true
  parent: ClothingNeckColorableDualColor
