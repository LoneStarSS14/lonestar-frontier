#region Kitten
- type: entity
  parent: [ ClothingShoesBaseButcherableHeelsNoisy, ClothingShoesRandomSpriteBaseColorInhand ]
  id: ClothingShoesHeelsKittenColorable
  name: kitten-heels
  description: A pair of cute kitten heels with a dainty ankle strap.
  components:
  - type: Sprite
    sprite: _LoneStar/Clothing/Shoes/Heels/kitten-heels-colorable.rsi
  - type: Clothing
    sprite: _LoneStar/Clothing/Shoes/Heels/kitten-heels-colorable.rsi

- type: entity
  parent: ClothingShoesHeelsKittenColorable
  id: ClothingShoesHeelsKitten
  categories: [ HideSpawnMenu ]
  components:
  - type: RandomSprite
    randomOnCreation: false
  - type: Sprite
    layers:
    - state: icon
    - state: icon-color
      color: "#F0F0F0"
      map: [ "shoes-icon" ]
  - type: Clothing
    clothingVisuals:
      shoes:
      - state: equipped-FEET
      - state: equipped-FEET-color
        color: "#F0F0F0"
        map: [ "shoes-equipped" ]
  - type: Item
    inhandVisuals:
      left:
        - state: inhand-left
        - state: inhand-left-color
          color: "#F0F0F0"
          map: [ "hl-color" ]
      right:
        - state: inhand-right
        - state: inhand-right-color
          color: "#F0F0F0"
          map: [ "hr-color" ]

