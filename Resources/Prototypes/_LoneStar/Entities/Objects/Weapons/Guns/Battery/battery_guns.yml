      shader: unshaded
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
  - type: Clothing
    sprite: _LoneStar/Objects/Weapons/Guns/Battery/lsrdpulse_heavy.rsi
  - type: Gun
