# Double Beds Left

- type: entity
  parent: Bed
  id: DoubleBedLeft
  name: double bed
  description: "This is used to lie in, sleep in or strap to. Double the bed, double the fun!""
  suffix: Left
  components:
  - type: Sprite
    sprite: _Everdream\Structures\Furniture\doublebeds.rsi
    state: left
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: "0, -0.25"
  - type: PlaceableSurface
    placeCentered: true
    positionOffset: 0, -0.25

