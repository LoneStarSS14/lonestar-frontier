# region ammo blueprints
- type: entityTable
  id: LSTableMercenaryBlueprint
  table: !type:GroupSelector
    children:
    - !type:NestedSelector # Legendary
      weight: 1
      tableId: LSTableMercenaryBlueprintT5
    - !type:GroupSelector
      weight: 49
      children:
      - !type:NestedSelector # Epic
        weight: 1
        tableId: LSTableMercenaryBlueprintT4
      - !type:GroupSelector
        weight: 19
        children:
        - !type:NestedSelector # Rare
          weight: 1
          tableId: LSTableMercenaryBlueprintT3
        - !type:GroupSelector
          weight: 9
          children:
          - !type:NestedSelector # Uncommon
            weight: 1
            tableId: LSTableMercenaryBlueprintT2
          - !type:GroupSelector
            weight: 3
            children:
            - !type:NestedSelector # Common
              weight: 7
              tableId: LSTableMercenaryBlueprintT1
            - !type:NestedSelector # Trash
              weight: 1
              tableId: LSTableMercenaryBlueprintT0

