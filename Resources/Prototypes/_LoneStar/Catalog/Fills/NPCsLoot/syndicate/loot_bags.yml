#region Tier 1
- type: entity
  parent: MarkerBasePlaceFree
  id: LSSpawnLootSyndicateT1Deckhand
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTableSpawner
    offset: 0.25
    table: !type:AllSelector
      children:
      - id: SpawnDungeonLootNpcSyndicateWeaponsPistols # Weapon
      - !type:NestedSelector # Armor
        tableId: LSTableSyndicateArmorNonLegendary
      - !type:NestedSelector # Blueprints
        tableId: LSTableSyndicateBlueprint
        prob: 0.15
      - !type:AllSelector # Loot
        children:
        - id: SpawnDungeonClutterMedipens
          prob: 0.25
        - id: SpawnDungeonLootMaterialsBasicFull
          prob: 0.3
        - id: SpawnRewardPrizeBallSyndicate
          prob: 0.3

