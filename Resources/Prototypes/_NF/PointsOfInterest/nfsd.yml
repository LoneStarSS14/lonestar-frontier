- type: pointOfInterest
  id: Nfsd
  parent: BasePOI
  name: 'LSRD Outpost' # Lonestar changes NFSD -> LSRD
  minimumDistance: 3500 # LoneStar
  maximumDistance: 4500 # LoneStar
  spawnGroup: Required
  gridPath: /Maps/_LoneStar/POI/lsrd.yml # LoneStar
  addComponents:
  - type: IFF
    color: "#ae7d57"
  - type: StationTransit
    routes:
      SpawnPoints: 10

- type: gameMap
  id: Nfsd
  mapName: 'NFSD Outpost'
  mapPath: /Maps/_LoneStar/POI/lsrd.yml # LoneStar
  minPlayers: 0
  stations:
    Nfsd:
      stationProto: SecurityFrontierOutpost
      components:
        - type: StationNameSetup
          mapNameTemplate: 'NFSD Outpost'
        - type: ExtraStationInformation
          iconPath: /Textures/_NF/Interface/StationIcons/nfsd-banner.png
          stationSubtext: 'frontier-lobby-nfsd-subtext'
          stationDescription: 'frontier-lobby-nfsd-description'
          lobbySortOrder: 2
        - type: StationJobs
          availableJobs: # LoneStar v
            LSChiefRanger: [ 2, 2 ]
            LSEnforcer: [ 5, 5 ]
            LSRetrievalOfficer: [ 5, 5 ]
            LSDetective: [ 5, 5 ]
            LSCorpsman: [ 5, 5 ]
            LSClerk: [ -1, -1 ]
        - type: StationDeadDropReporting
          messageSet: Nfsd
        - type: StationDeadDropHintExempt
