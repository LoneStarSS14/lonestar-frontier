  - type: PhysicalComposition
    materialComposition:
      Steel: 500 # Frontier: 600<500
      Plastic: 100
  - type: StaticPrice
    price: 55 # Frontier 110<55
    vendPrice: 5000 # Frontier
  - type: UserInterface
