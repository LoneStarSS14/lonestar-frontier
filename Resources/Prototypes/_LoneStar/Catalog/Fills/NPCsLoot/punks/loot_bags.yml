    offset: 0.25
    table: !type:AllSelector
      children:
      - !type:GroupSelector # Weapon
        children:
        - id: WeaponCaseLongLaserCarbineExpedition
          weight: 0.6
        - id: SpawnDungeonLootNpcMercenariesEnergy
          weight: 0.4
      - !type:GroupSelector # Armor
        children:
        - id: ClothingOuterArmorElitePunkRandomized
          weight: 0.6
