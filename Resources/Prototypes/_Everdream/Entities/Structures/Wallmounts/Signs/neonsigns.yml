# 32x32
- type: entity
  parent: BaseSign
  id: NeonSignBase
  abstract: true
  components:
    - type: WallMount
      arc: 360
    - type: Sprite
      drawdepth: Overdoors
      snapCardinals: true # one direction
      damageContainer: Inorganic
      damageModifierSet: RGlass
    - type: Anchorable
    - type: Pullable
    - type: Rotatable
    - type: Transform
      anchored: true
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: WindowShatter
              params:
                volume: -8

- type: entity
  id: NeonSignLCbg
  name: Little Cheeser's Neon Sign
  description: Featuring the Little Cheeser's mascot.
  suffix: background
  components:
  - type: Sprite
    sprite: _Everdream/Structures/Wallmounts/neonsigns.rsi
    state: neonsign_LC_bg
  - type: PointLight
    radius: 3
    energy: 1
    color: '#ff5100'

