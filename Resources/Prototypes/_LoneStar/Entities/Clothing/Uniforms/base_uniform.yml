- type: entity
  abstract: true
  id: ClothingUniformRandomSpriteMono
  suffix: Random
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "uniform-icon" ]
  - type: Clothing
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        map: [ "uniform-equipped" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - uniform-icon:
          icon: Base
        uniform-equipped:
          equipped-INNERCLOTHING: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a set color layer, and a single colorable layer
  abstract: true
  id: ClothingUniformRandomSpriteBaseColor
  suffix: Random
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-color
      map: [ "uniform-icon" ]
  - type: Clothing
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
      - state: equipped-INNERCLOTHING-color
        map: [ "uniform-equipped" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - uniform-icon:
          icon-color: Base
        uniform-equipped:
          equipped-INNERCLOTHING-color: Base
    mappedColors:
      Base: NTInteriorDesign
