# region helmets
- type: entity
  parent: [ ClothingHeadSuitWithLightBase, ClothingHeadEVAHelmetBase ]
  id: ClothingHeadHelmetResponseRed
  name: CSI-128X Response hardsuit helm
  components:
  - type: Sprite
    sprite: _Omu/Clothing/Head/Hardsuits/cybersunscientisthelmet.rsi
  - type: HandheldLight
    addPrefix: false
  - type: Clothing
    sprite: _Omu/Clothing/Head/Hardsuits/cybersunscientisthelmet.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
      head-feroxi:
      - state: equipped-HELMET-feroxi
      head-vulpkanin:
      - state: equipped-HELMET-vulpkanin
      head-reptilian:
      - state: equipped-HELMET-reptilian
  - type: ToggleableVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: equipped-HELMET
        shader: unshaded
      head-feroxi:
      - state: equipped-HELMET-feroxi
        shader: unshaded
      head-vulpkanin:
      - state: equipped-HELMET-vulpkanin
        shader: unshaded
      head-reptilian:
      - state: equipped-HELMET-reptilian
        shader: unshaded
  - type: PointLight
    color: "#d96050"
    radius: 7  
    energy: 3

