# Waterfalls
- type: entity
  parent: FloorWaterfallBase
  id: FloorWaterfallEntitySomberPool
  name: somber pool waterfall
  suffix: Non-Occluded
  description: "Dark water, like something drawn up from far below. But there is nothing down there."
  components:
  - type: Sprite
    drawdepth: Overdoors
    sprite: _DEN/Tiles/Planet/Somber/waterfall.rsi
    layers:
    - state: pooltile
    - state: waterfallcut
      offset: 0,0.125 # 4 pixels up to reach the spout
    - state: pooltile
    - state: waterfallshinecut
      offset: 0,0.125
      shader: unshaded

# Waterfall Spouts

- type: entity
  parent: BaseStructure
  id: SomberPoolWaterfallSpout
  name: somber pool waterfall spout
  description: "A narrow spout set into the wall, providing fresh water from hidden filters."
  components:
  - type: Sprite
    drawdepth: Overdoors
    sprite: _DEN/Tiles/Planet/Somber/waterfall.rsi
    state: poolwaterfallspout
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  parent: SomberPoolWaterfallSpout
  id: SomberPoolWaterfallSpoutDark
  suffix: Wall, Dark
  components:
  - type: Sprite
    state: poolwaterfallspoutdark
