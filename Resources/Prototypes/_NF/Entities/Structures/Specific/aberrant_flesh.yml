- type: entity
  parent: XenoWardingTower
  id: AberrantFleshDigestiveSack
  name: assimilation sack
  description: Huh, an assimilation sack? How do I even know this?
  components:
  # LoneStar changes start: removing double spawner.
  # - type: Timer
  # - type: TimedSpawner
  #   prototypes:
  #   - SpawnMobAberrantFleshNewbornExpeditions
  #   chance: 0.85
  #   intervalSeconds: 240
  # LoneStar changes end
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 500
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Sprite
    sprite: _NF/Structures/Specific/AberrantFlesh/digestivesack.rsi
    drawdepth: Mobs
    snapCardinals: true
    layers:
    - state: base
    - state: unshaded
      shader: unshaded
  - type: AmbientSound
    volume: -9
    range: 5
    sound:
      collection: blood #eating
      params:
        variation: 0.250
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection:
          MeatBulletImpact
    soundTypes:
      Heat:
        collection:
          MeatLaserImpact
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: gib
      - !type:SpawnEntitiesBehavior
        spawn:
          FoodMeat:
            min: 1
            max: 2
  - type: SalvageObjectiveNpcSpawner # LoneStar
    spawnIntervalSeconds: 55
    spawnIntervalVariance: 5
    nearbyRange: 15
    spawnRange: 6
    maxNearby: 7
    nearbyFactions:
    - AberrantFleshExpeditionNF
    spawnPrototypes:
    - SpawnMobAberrantFleshNewbornExpeditions
