- type: job
  id: LSCorpsman
  name: job-name-ls-corpsman
  description: job-description-ls-corpsman
  supervisors: job-supervisors-ls-chief-ranger # TODO: update after corpsman is demilitarized
  playTimeTracker: JobLSCorpsman
  requirements:
    # - !type:DepartmentTimeRequirement # To be enabled 2 weeks after implementation
    #   department: LSLSRD
    #   time: 57600 # 16 hours
    - !type:RoleTimeRequirement
      role: JobMedicalNurse
      time: 57600 # 16 hours
  weight: 20
  displayWeight: 20
  startingGear: LSCorpsmanGear
  icon: "JobIconLSCorpsman"
  # Frontier's fields
  hideConsoleVisibility: true
  newPlayerMessage: false
  # Common v
  access:
  - Brigmedic
  accessGroups:
  - GeneralNfsdAccess
  special:
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
  #lsrd specific
  - !type:AddComponentSpecial
    components:
    - type: IsNfsd
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, TrackingImplant ]
  #RPI
  - !type:AddRpiJobModifierSpecial
    modifiersToAdd:
    - rpiJobModifierBrigMedic
  - !type:AddRpiAuraSpecial
    aurasToAdd:
    - rpiAuraNurse
  - !type:RpiChatJudgementModifierSpecial
    modsToAdd:
    - rpiChatJudgementModifierNurse

- type: entity
  id: SpawnPointLSCorpsman
  parent: SpawnPointJobBase
  name: corpsman spawn point
  suffix: LoneStar
  components:
  - type: SpawnPoint
    job_id: LSCorpsman
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner-red

- type: startingGear
  id: LSCorpsmanGear
  equipment:
    pocket1: NFWeaponPistolUniversalNfsdLessLethal
    pocket2: ContrabandAppraisalTool
  storage:
    back:
    - Flash
    - CSMagazinePistol40Overpressure
    - CSMagazinePistol40Rubber
    - BaseSecurityUplinkRadioOfficer

- type: roleLoadout
  id: JobLSCorpsman
  canCustomizeName: true
  groups:
  # Unique v
  - LSLSRDCorpsmanPDA
  # LSRD v
  - LSLSRDFactionJumpsuit
  - LSLSRDFactionOuterClothing
  - LSLSRDFactionShoes
  - LSLSRDFactionGloves
  - LSLSRDFactionHead
  - LSLSRDFactionMask
  - LSLSRDFactionEyes
  - LSLSRDFactionNeck
  - LSLSRDFactionEars
  - LSLSRDFactionBackpack
  - LSLSRDFactionBelt
  - LSLSRDFactionWallet
  - LSLSRDFactionEncryptionKey
  - LSLSRDFactionImplanter
  # Common v
  # - ContractorBoxSurvival
  - ContractorCartridge
  # - ContractorBackpackItems
  - ContractorHandItems
  - ContractorInstruments
  # - NFSpeciesSpecific
  # Temporary / TODO: replace
  - NfsdBoxSurvival
