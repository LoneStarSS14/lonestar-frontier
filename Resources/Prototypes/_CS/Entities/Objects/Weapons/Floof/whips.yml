- type: entity
  parent: BaseItem
  id: BaseWhip
  abstract: true
  components:
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Slash: 2
    angle: 120
    animation: WeaponArcSlash
    soundHit:
      path: /Audio/Floof/Lewd/whip.ogg
  - type: StaminaDamageOnHit
    damage: 20
  - type: StaminaDamageOnCollide
    damage: 20
  - type: StaticPrice
    price: 60
  - type: Item
    size: Normal

- type: entity
  parent: BaseWhip
  id: WhipPink
  name: pink whip
  description: A pink whip to keep someone on task.
  components:
  - type: Sprite
    sprite: _CS/Objects/Weapons/Floof/whip_pink.rsi
