#region Plastitanium
- type: rcd
  id: WallPlastitanium
  category: Walls # Lonestar
  sprite: { sprite: Structures/Walls/plastitanium.rsi, state: full }
  mode: ConstructObject
  prototype: WallPlastitanium
  cost: 8
  delay: 2
  collisionMask: FullTileMask
  rotation: Fixed
  fx: EffectRCDConstruct2

- type: rcd
  id: WallPlastitaniumDiagonal
  category: Walls # Lonestar
  sprite: { sprite: Structures/Walls/plastitanium_diagonal.rsi, state: state0 }
  mode: ConstructObject
  prototype: WallPlastitaniumDiagonal
  cost: 8
  delay: 2
  collisionMask: FullTileMask
  collisionBounds: "-0.23,-0.49,0.23,-0.36"
  rotation: User
  fx: EffectRCDConstruct2

- type: rcd
  id: PlastitaniumWindow
