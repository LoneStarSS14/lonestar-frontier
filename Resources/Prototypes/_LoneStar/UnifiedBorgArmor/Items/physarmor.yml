#Borg Armor. Originally made & balanced with Hardlight in Mind.
#Subject to rebalancing as required.

- type: entity
  parent: SyntheticBorgArmorBase #Inherit all changes from this. Hopefully will prevent compatability issues in the future
  id: SyntheticBorgArmorLight # Light Armor. No slowdown.
  name: LSAP-MKII Armour Plating
  description: Light Synthetic Armour. Thin, interwoven plates of plasteel, synthetic fibers, and steel. Mildly protective.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/BorgArmor/physarmor/borglightarmor.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.75 #Decent, as borgs tend to become lego when meeting explosive/structural damage
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.85
        Heat: 0.85
  - type: ClothingSpeedModifier  # Stacks with other slowdowns. Be careful!
    walkModifier: 1
    sprintModifier: 1.25 # So there's a bonus to wearing this over the medium armor

- type: entity
  parent: SyntheticBorgArmorBase #Inherit all changes from this. Hopefully will prevent compatability issues in the future
  id: SyntheticBorgArmorMedium # Medium Armor. Decent protection, heavier than usual slowdown.
  name: MSAP-MKIV Medium Plating
  description: Medium Synthetic Armour Plates. A mix of plastitanium and plasteel alloys, thick enough to shrug off small arms fire, while not heavily impeding mobility.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/BorgArmor/physarmor/borgmediumarmor.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.55  
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.75
        Heat: 0.75
  - type: ClothingSpeedModifier  # Stacks with other slowdowns. Be careful!
    walkModifier: 0.95
    sprintModifier: 0.95

- type: entity
  parent: SyntheticBorgArmorBase #Inherit all changes from this. Hopefully will prevent compatability issues in the future
  id: SyntheticBorgArmorHeavy # Heavy Armor. Only able to be acquired from research. Slightly better than a blood-red suit, but comes with heavy penalties to movement speed. 
  name: HSAP-MKV Heavy Plating
  description: Heavy-Duty and rugged; meant for active combat, this set of heavy synthetic armour plates boasts near-three-inch ballistic plates, mixed with synthetic fibers, underlying support structures and kinetic gel to disperse impact. Whatever you strap this to, isn't going anywhere anytime soon.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/BorgArmor/physarmor/borgheavyarmor.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.35  
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.6
        Heat: 0.6
  - type: ClothingSpeedModifier  # Stacks with other slowdowns. Be careful!
    walkModifier: 0.85 # You are the Persuer.
    sprintModifier: 0.75 # Ditto

- type: entity
  parent: SyntheticBorgArmorBase #Inherit all changes from this. Hopefully will prevent compatability issues in the future
  id: SyntheticBorgArmorTerminator # Event/Traitor/Adminbus Armor.
  name: TVOK-Terminator Plating
  suffix: Admeme
  description: Salvaged, Acquired, or otherwise procured; this set of armor is clearly designed for the heaviest duties, and most extreme environments. Lifting it is nearly impossible, with the near foot-thick plates of solid alloys and plates meant to deflect projectiles creaking with each motion.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/BorgArmor/physarmor/borgheavyarmor.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.01 # Do not resist. You are being rescued.
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.15
        Slash: 0.05
        Piercing: 0.1
        Heat: 0.1
  - type: ClothingSpeedModifier  # Stacks with other slowdowns. Be careful!
    walkModifier: 1
    sprintModifier: 1
