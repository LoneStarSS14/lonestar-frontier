
#region Colorable Bases
- type: entity # for sprites with a single colored layer
  abstract: true
  id: ClothingUniformColorableMono
  suffix: Colorable
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "uniform-icon" ]
  - type: Clothing
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        map: [ "uniform-equipped" ]
  - type: ColorableClothing
    available:
      - uniform-icon:
          icon: Base
        uniform-equipped:
          equipped-INNERCLOTHING: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a set layer, and a single colored layer
  abstract: true
  id: ClothingUniformColorableBaseColor
  suffix: Colorable
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-color
      map: [ "uniform-icon" ]
  - type: Clothing
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
      - state: equipped-INNERCLOTHING-color
        map: [ "uniform-equipped" ]
  - type: ColorableClothing
    available:
      - uniform-icon:
          icon-color: Base
        uniform-equipped:
          equipped-INNERCLOTHING-color: Base
    mappedColors:
      Base: NTInteriorDesign

- type: entity # for sprites with a set layer, and a single colored layer, supporting inhands
  abstract: true
  parent: ClothingUniformColorableBaseColor
  id: ClothingUniformColorableBaseColorInhand
  suffix: Colorable
  components:
  - type: Item
    inhandVisuals:
      left:
        - state: inhand-left
        - state: inhand-left-color
          map: [ "hl-color" ]
      right:
        - state: inhand-right
        - state: inhand-right-color
          map: [ "hr-color" ]
  - type: ColorableClothing
    available:
      - uniform-icon:
          icon-color: Base
        uniform-equipped:
          equipped-INNERCLOTHING-color: Base
        hl-color:
          inhand-left-color: Base
        hr-color:
          inhand-right-color: Base
    mappedColors:
      Base: NTInteriorDesign

- type: entity # for sprites with a 2 colored layers
  abstract: true
  id: ClothingUniformColorableDualColor
  suffix: Colorable
  components:
  - type: Sprite
    layers:
    - state: icon-primary
      map: [ "uniform-icon-primary" ]
    - state: icon-secondary
      map: [ "uniform-icon-secondary" ]
  - type: Clothing
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING-primary
        map: [ "uniform-equipped-primary" ]
      - state: equipped-INNERCLOTHING-secondary
        map: [ "uniform-equipped-secondary" ]
  - type: ColorableClothing
    available:
      - uniform-icon-primary:
          icon-primary: Primary
        uniform-icon-secondary:
          icon-secondary: Secondary
        uniform-equipped-primary:
          equipped-INNERCLOTHING-primary: Primary
        uniform-equipped-secondary:
          equipped-INNERCLOTHING-secondary: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign

- type: entity # for sprites with a 2 colored layers, supporting inhands
  abstract: true
  parent: ClothingUniformColorableDualColor
  id: ClothingUniformColorableDualColorInhand
  suffix: Colorable
  components:
  - type: Item
    inhandVisuals:
      left:
        - state: inhand-left-primary
          map: [ "hl-primary" ]
        - state: inhand-left-secondary
          map: [ "hl-secondary" ]
      right:
        - state: inhand-right-primary
          map: [ "hr-primary" ]
        - state: inhand-right-secondary
          map: [ "hr-secondary" ]
  - type: ColorableClothing
    available:
      - uniform-icon-primary:
          icon-primary: Primary
        uniform-icon-secondary:
          icon-secondary: Secondary
        uniform-equipped-primary:
          equipped-INNERCLOTHING-primary: Primary
        uniform-equipped-secondary:
          equipped-INNERCLOTHING-secondary: Secondary
        hl-primary:
          inhand-left-primary: Primary
        hl-secondary:
          inhand-left-secondary: Secondary
        hr-primary:
          inhand-right-primary: Primary
        hr-secondary:
          inhand-right-secondary: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign

#region Specific Bases
- type: entity # Used as an intermediate by wizden's base colored jumpsuits to minimize changes.
  abstract: true
  id: BaseClothingUniformJumpsuitColorable
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpskirt/color.rsi
    layers:
    - state: icon
      color: "#ffffff"
      map: [ "uniform-icon" ]
    - state: trinkets-icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#ffffff"
        map: [ "hl-color" ]
      - state: trinkets-inhand-left
      right:
      - state: inhand-right
        color: "#ffffff"
        map: [ "hr-color" ]
      - state: trinkets-inhand-right
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpskirt/color.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#ffffff"
        map: [ "uniform-equipped" ]
      - state: trinkets-equipped-INNERCLOTHING
  - type: ColorableClothing
    randomOnCreation: false
    mappedColors:
      Base: NTInteriorDesign
    available:
      - uniform-icon:
          icon: Base
        uniform-equipped:
          equipped-INNERCLOTHING: Base
        hl-color:
          inhand-left: Base
        hr-color:
          inhand-right: Base