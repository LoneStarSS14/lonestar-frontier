  id: PizzaBase
  start: start
  graph:
  - node: start
    entity: FoodDoughFlat
    edges:
    - to: dough-pizza
      steps:
      - tool: Rolling
        doAfter: 1

  - node: dough-pizza
    entity: FoodPizzaBase
