- type: entity
  parent: VendingMachineClothing
  id: VendingMachineBnuuy
  name: BnuuyDrobe
  description: A vending machine for bunnies and bunny accessories.
  components:
  - type: VendingMachine
    pack: BnuuyInventory
  - type: Sprite
    sprite: _LoneStar/Structures/Machines/VendingMachines/bnuuy.rsi

- type: entity
  parent: VendingMachineClothing
  id: VendingMachineCoyote
  name: CoyoteVend
  description: A vending machine made for coyotes, by coyotes, of coyotes.
  components:
  - type: VendingMachine
    offState: off
    brokenState: broken
    normalState: normal-unshaded
    ejectState: eject-unshaded
    denyState: deny-unshaded
    pack: CoyoteInventory
  - type: Sprite
    sprite: _LoneStar/Structures/Machines/VendingMachines/coyote.rsi
    layers:
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: "off"
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]

