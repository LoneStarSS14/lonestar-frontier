- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesGlassesRimless
  name: rimless glasses
  description: A pair of round, rimless glasses. Barely there.
  components:
    - type: Sprite
      sprite: _DEN/Clothing/Eyes/Glasses/rimless.rsi
    - type: Clothing
      sprite: _DEN/Clothing/Eyes/Glasses/rimless.rsi
      slots:
      - HEAD
      - EYES
    - type: VisionCorrection
    - type: Tag
      tags:
      - WhitelistChameleon

