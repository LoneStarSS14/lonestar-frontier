# From KC/Sushiburger: Double bed construction graphs. Based partially off of how fancy tables work.

# Base Bed Left
- type: constructionGraph
  id: DoubleBedLeft
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: DoubleBedLeft
          completed:
            - !type:SnapToGrid { }
          steps:
            - material: Steel
              amount: 3
              doAfter: 2
            - material: Cloth
              amount: 3
              doAfter: 2

# Finished Base Bed. Deconstructing requires screwdriver.
    - node: DoubleBedLeft
      entity: DoubleBedLeft
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 3
            - !type:SpawnPrototype
              prototype: MaterialCloth1
              amount: 3
          steps:
            - tool: Screwing
              doAfter: 2
# Transformative Constructions
        - to: DoubleBedLeftBlack
          steps:
            - tag: BedsheetBlack
              doAfter: 1
              name: black-bedsheet # Needed to make the construction menu pretty. By tag does not fetch this stuff by itself.
              icon: 
                sprite: Objects/Misc/bedsheets.rsi
                state: sheetblack
    
        - to: DoubleBedLeftBlue
          steps:
            - tag: BedsheetBlue
              doAfter: 1
              name: blue-bedsheet
              icon: 
                sprite: Objects/Misc/bedsheets.rsi
                state: sheetblue

        - to: DoubleBedLeftBrown
          steps:
            - tag: BedsheetBrown
              doAfter: 1
              name: brown-bedsheet
              icon: 
                sprite: Objects/Misc/bedsheets.rsi
                state: sheetbrown

        - to: DoubleBedLeftCC
