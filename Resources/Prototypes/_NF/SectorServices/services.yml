  id: Mail
  components:
  - type: SectorLogisticStats
  - type: SectorMail # Contains sector-wide mail parameters

- type: sectorService
  id: ShuttleRecords
  components:
  - type: SectorShuttleRecords

- type: sectorService
  id: BankAccounts
  components:
  - type: SectorBank
    accounts:
      Frontier:
        !type:SectorBankAccountInfo
        balance: 8000
        increasePerSecond: 10 # Lonestar 1 > 10
      Nfsd:
        !type:SectorBankAccountInfo
        balance: 8000
        increasePerSecond: 20 # 72K per hour, about enough for minimum wage for the default NFSD size
      Medical:
        !type:SectorBankAccountInfo
        balance: 8000
        increasePerSecond: 10 # Lonestar 6 > 10
      Edison:
        !type:SectorBankAccountInfo
        balance: 8000
        increasePerSecond: 1 # A trickle - generate your own power to sell for stuff.
      Guild: # LoneStar
        !type:SectorBankAccountInfo
        balance: 8000
        increasePerSecond: 1

