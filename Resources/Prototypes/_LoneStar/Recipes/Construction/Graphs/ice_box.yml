- type: constructionGraph
  id: IceBox
  start: start
  graph:
  - node: start
    edges:
    - to: body
      steps:
      - material: Steel
        amount: 4
        doAfter: 1

  - node: body
    entity: IceBoxUnfinished
    edges:
    - to: start
      conditions:
      - !type:EntityAnchored
        anchored: false
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 4
      - !type:DeleteEntity
      steps:
      - tool: Screwing
        doAfter: 1
    - to: plumbing
      conditions:
      - !type:EntityAnchored
      steps:
      - tag: PlumbingAssembly
        name: construction-graph-tag-plumbing-assembly
        icon:
          sprite: Structures/Piping/Atmospherics/pump.rsi
          state: pumpManualValve
        doAfter: 1

  - node: plumbing
    entity: IceBoxUnfinished
    edges:
    - to: body
      completed:
      - !type:SpawnPrototype
        prototype: PlumbingAssembly
      steps:
      - tool: Prying
        doAfter: 1
    - to: electronics
      steps:
      - tool: Anchoring
        doAfter: 1

  - node: electronics
    entity: IceBoxUnfinished
    edges:
    - to: body
      completed:
      - !type:SpawnPrototype
        prototype: PlumbingAssembly
      steps:
      - tool: Prying
        doAfter: 1
    - to: installElectronics
      conditions:
        - !type:EntityAnchored
      steps:
        - tag: FreezerElectronics
          name: construction-graph-tag-freezer-electronics
          icon:
            sprite: Objects/Misc/module.rsi
            state: door_electronics
          doAfter: 1

  - node: installElectronics
    entity: IceBoxUnfinished
    edges:
      - to: electronics
        completed:
        - !type:SpawnPrototype
          prototype: FreezerElectronics
        steps:
        - tool: Prying
          doAfter: 1
      - to: done
        conditions:
        - !type:EntityAnchored
        steps:
        - tool: Screwing
          doAfter: 1

  - node: done
    entity: IceboxEmpty
    edges:
    - to: installElectronics
      completed:
        - !type:SetAnchor
        - !type:EmptySolution
          solution: drainBuffer
          spill: true
      steps:
        - tool: Screwing
          doAfter: 1