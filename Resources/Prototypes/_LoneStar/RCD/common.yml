## Note: diagonal walls use collisionBounds, the values are weird, idk how it works, but everything else uses it.
## Things defined here are for what is missing from frontier/wizden, and not a complete set of what can be provided.
## RCDs are for construction, not primarily decoration, if you are making a new RCD for decals, see the HRCD from _Everdream

#region Reinforced
- type: rcd
  id: WallReinforced
  category: Walls
  sprite: /Textures/Interface/Radial/RCD/reinforced_wall.png
  mode: ConstructObject
  prototype: WallReinforced
  cost: 6
  delay: 2
  collisionMask: FullTileMask
  rotation: Fixed
  fx: EffectRCDConstruct2
#endregion

#region Shuttle
- type: rcd
