- type: entity #LoneStar adds green exterior light bulb for colorblind accessiblity
  parent: LightBulb
  name: green exterior light bulb
  id: ExteriorLightBulbGreen
  description: A colorful light bulb with a small colored crystal inside.
  components:
  - type: LightBulb
    color: "#00FF00"
    lightEnergy: 4.5
    lightRadius: 8
    lightSoftness: 0.7

