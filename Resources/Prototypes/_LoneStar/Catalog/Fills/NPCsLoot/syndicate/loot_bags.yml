#region Bosses
- type: entity
  parent: MarkerBasePlaceFree
  id: LSSpawnLootBagSyndicateT4Commander
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTableSpawner
    offset: 0.25
    table: !type:AllSelector
      children:
      - !type:AllSelector # Weapon
        children:
        - !type:NestedSelector # Weapon
          tableId: LSTableSyndicateWeaponRangedRifle
          prob: 0.6
        - !type:NestedSelector # Weapon
          tableId: LSTableGeneralWeaponRangedT3
          prob: 0.3
      - !type:GroupSelector # Armor
        children:
        - id: ClothingOuterHardsuitSyndieElite
          weight: 1
        - !type:NestedSelector
          weight: 17
          tableId: LSTableSyndicateArmor
      - !type:AllSelector # Blueprints
        children:
        - !type:NestedSelector
          tableId: LSTableSyndicateBlueprint
        - !type:NestedSelector
          tableId: LSTableSyndicateBlueprint
          prob: 0.7
        - !type:NestedSelector
          tableId: LSTableSyndicateBlueprint
          prob: 0.3
      - !type:AllSelector # Loot
        children:
        - !type:NestedSelector
          tableId: TableDungeonLootNpcBossLootShared
          rolls: 3
          prob: 0.3
        - id: SpawnRewardPrizeBallSyndicate
