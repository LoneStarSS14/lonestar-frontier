- type: entity
  name: emerald lizitar
  parent: [Claymore, BaseC1Contraband]
  id: LizitarEmerald
  description: Caledscratch && Emerald Contraband. Why is it so expensive? What the hell is 'grist'? This weapon leaves you with so many questions.
  components:
  - type: Sprite
    sprite: _LoneStar/Objects/Weapons/Melee/Lizitar/Emerald.rsi
  - type: Item
    storedSprite:
      state: emerald
      sprite: _LoneStar/Objects/Weapons/Melee/storage.rsi
  - type: MeleeWeapon
    attackRate: 0.75
    damage:
      types:
        Slash: 30 # hurts, but you better not miss
    soundHit:
        path: /Audio/Items/Toys/weh.ogg
  - type: Clothing
    sprite: _LoneStar/Objects/Weapons/Melee/Lizitar/Emerald.rsi
    slots:
    - back
    - suitStorage
  - type: DisarmMalus

