
#region Colorable Bases
- type: entity # for sprites with a single colored layer
  abstract: true
  id: ClothingShoesColorableMono
  suffix: Colorable
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "shoes-icon" ]
  - type: Clothing
    clothingVisuals:
      shoes:
      - state: equipped-FEET
        map: [ "shoes-equipped" ]
  - type: ColorableClothing
    available:
      - shoes-icon:
          icon: Base
        shoes-equipped:
          equipped-FEET: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a 2 colored layers
  abstract: true
  id: ClothingShoesColorableDualColor
  suffix: Colorable
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "shoes-icon-primary" ]
    - state: icon-color
      map: [ "shoes-icon-secondary" ]
  - type: Clothing
    clothingVisuals:
      shoes:
      - state: equipped-FEET
        map: [ "shoes-equipped-primary" ]
      - state: equipped-FEET-color
        map: [ "shoes-equipped-secondary" ]
  - type: ColorableClothing
    available:
      - shoes-icon-primary:
          icon: Primary
        shoes-icon-secondary:
          icon-color: Secondary
        shoes-equipped-primary:
          equipped-FEET: Primary
        shoes-equipped-secondary:
          equipped-FEET-color: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a 2 colored layers, supporting inhands
  abstract: true
  parent: ClothingShoesColorableDualColor
  id: ClothingShoesColorableDualColorInhand
  suffix: Colorable
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        map: [ "hl-primary" ]
      - state: inhand-left-color
        map: [ "hl-secondary" ]
      right:
      - state: inhand-right
        map: [ "hr-primary" ]
      - state: inhand-right-color
        map: [ "hr-secondary" ]
  - type: ColorableClothing
    available:
      - shoes-icon-primary:
          icon: Primary
        shoes-icon-secondary:
          icon-color: Secondary
        shoes-equipped-primary:
          equipped-FEET: Primary
        shoes-equipped-secondary:
          equipped-FEET-color: Secondary
        hl-primary:
          inhand-left: Primary
        hl-secondary:
          inhand-left-color: Secondary
        hr-primary:
          inhand-right: Primary
        hr-secondary:
          inhand-right-color: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign

- type: entity # for sprites with a set color layer, and a single colorable layer
  abstract: true
  id: ClothingShoesColorableBaseColor
  suffix: Colorable
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-color
      map: [ "shoes-icon" ]
  - type: Clothing
    clothingVisuals:
      shoes:
      - state: equipped-FEET
      - state: equipped-FEET-color
        map: [ "shoes-equipped" ]
  - type: ColorableClothing
    available:
      - shoes-icon:
          icon-color: Base
        shoes-equipped:
          equipped-FEET-color: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a set color layer, and a single colorable layer, supporting inhands
  abstract: true
  parent: ClothingShoesColorableBaseColor
  id: ClothingShoesColorableBaseColorInhand
  suffix: Colorable
  components:
  - type: Item
    inhandVisuals:
      left:
        - state: inhand-left
        - state: inhand-left-color
          map: [ "hl-color" ]
      right:
        - state: inhand-right
        - state: inhand-right-color
          map: [ "hr-color" ]
  - type: ColorableClothing
    available:
      - shoes-icon:
          icon-color: Base
        shoes-equipped:
          equipped-FEET-color: Base
        hl-color:
          inhand-left-color: Base
        hr-color:
          inhand-right-color: Base
    mappedColors:
      Base: NTInteriorDesign
