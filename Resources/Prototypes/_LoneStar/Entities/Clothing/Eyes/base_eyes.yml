
#region Colorable Bases
- type: entity # for sprites with a single colored layer
  abstract: true
  id: ClothingEyesRandomSpriteMono
  suffix: Random
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "eyes-icon" ]
  - type: Clothing
    clothingVisuals:
      eyes:
      - state: equipped-EYES
        map: [ "eyes-equipped" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - eyes-icon:
          icon: Base
        eyes-equipped:
          equipped-EYES: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a set layer, and a single colored layer
  abstract: true
  id: ClothingEyesRandomSpriteBaseColor
  suffix: Random
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: icon-color
      map: [ "eyes-icon" ]
  - type: Clothing
    clothingVisuals:
      eyes:
      - state: equipped-EYES
      - state: equipped-EYES-color
        map: [ "eyes-equipped" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - eyes-icon:
          icon-color: Base
        eyes-equipped:
          equipped-EYES-color: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a set layer, and a single colored layer, supporting inhands
  abstract: true
  parent: ClothingEyesRandomSpriteBaseColor
  id: ClothingEyesRandomSpriteBaseColorInhand
  suffix: Random
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
      - state: inhand-left-color
        map: [ "hl-color" ]
      right:
      - state: inhand-right
      - state: inhand-right-color
        map: [ "hr-color" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - eyes-icon:
          icon-color: Base
        eyes-equipped:
          equipped-EYES-color: Base
        hl-color:
          inhand-left-color: Base
        hr-color:
          inhand-right-color: Base
    mappedColors:
      Base: NTInteriorDesign

- type: entity # for sprites with a 2 colored layers
  abstract: true
  id: ClothingEyesRandomSpriteDualColor
  suffix: Random
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "eyes-icon-primary" ]
    - state: icon-color
      map: [ "eyes-icon-secondary" ]
  - type: Clothing
    clothingVisuals:
      eyes:
      - state: equipped-EYES
        map: [ "eyes-equipped-primary" ]
      - state: equipped-EYES-color
        map: [ "eyes-equipped-secondary" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - eyes-icon-primary:
          icon: Primary
        eyes-icon-secondary:
          icon-color: Secondary
        eyes-equipped-primary:
          equipped-EYES: Primary
        eyes-equipped-secondary:
          equipped-EYES-color: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a 2 colored layers, supporting inhands
  abstract: true
  parent: ClothingEyesRandomSpriteDualColor
  id: ClothingEyesRandomSpriteDualColorInhand
  suffix: Random
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        map: [ "hl-primary" ]
      - state: inhand-left-color
        map: [ "hl-secondary" ]
      right:
      - state: inhand-right
        map: [ "hr-primary" ]
      - state: inhand-right-color
        map: [ "hr-secondary" ]
  - type: RandomSprite
    denyReroll: false
    available:
      - eyes-icon-primary:
          icon: Primary
        eyes-icon-secondary:
          icon-color: Secondary
        eyes-equipped-primary:
          equipped-EYES: Primary
        eyes-equipped-secondary:
          equipped-EYES-color: Secondary
        hl-primary:
          inhand-left: Primary
        hl-secondary:
          inhand-left-color: Secondary
        hr-primary:
          inhand-right: Primary
        hr-secondary:
          inhand-right-color: Secondary
    mappedColors:
      Primary: LSSilks
      Secondary: NTInteriorDesign
