## LoneStar changes: All references of 'Sixteen' -> 'NTInteriorDesign'
## changes: adds mapped color definitions to all entries

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformRandom
  abstract: true
  description: Generated by neural networks based on the latest fashion trends.
  suffix: Random visual
  components:
  - type: SuitSensor
  - type: Sprite
    sprite: Clothing/Uniforms/procedural.rsi
    layers:
    - state: base_torso_standard
      map: [ "torso" ]
    - state: base_leg_standard
      map: [ "leg" ]
    - state: mask_null
      map: [ "decor" ]
    - state: mask_null
      map: [ "overlay" ]
  - type: Clothing
    sprite: Clothing/Uniforms/procedural.rsi
    clothingVisuals:
      jumpsuit:
      - state: base_torso_standard
        map: [ "torso" ]
      - state: base_leg_standard
        map: [ "leg" ]
      - state: mask_null
        map: [ "decor" ]
      - state: mask_null
        map: [ "overlay" ]
  - type: ColorableClothing # LoneStar
    mappedColors: # TODO: loadouts show all mapped colors even when they are not used. fix.
      Torso: NTInteriorDesign
      Leg: NTInteriorDesign
      Decor: NTInteriorDesign
      Overlay: NTInteriorDesign

- type: entity
  parent: ClothingUniformRandom
  id: ClothingRandomSpawner
  name: random colorful outfit # Frontier: costume<outfit
  components:
  - type: RandomSpawner
    offset: 0
    prototypes:
    - ClothingUniformRandomArmless
    - ClothingUniformRandomStandard
    - ClothingUniformRandomBra
    - ClothingUniformRandomShorts
    - ClothingUniformRandomShirt

