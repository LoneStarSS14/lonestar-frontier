# Advanced Collar and Modules

- type: entity
  parent: ClothingNeckCollarBaseFoldable
  id: ClothingNeckAdvancedCollarBase
  name: advanced collar
  description: A modular collar that can have various functional modules installed.
  abstract: true
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Neck/Collars/collar_black.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Neck/Collars/collar_black.rsi
    equipDelay: 1 # LoneStar
    unequipDelay: 5 # LoneStar
  - type: AdvancedCollar
    maxModules: 7 # LoneStar
  - type: ContainerContainer
    containers:
      collar_module_container: !type:Container
  - type: Tag # LoneStar, hide in chameleon menu
    tags:
    - ClothMade
    - Recyclable

