- type: job
  id: LSClerk
  name: job-name-ls-clerk
  description: job-description-ls-clerk
  supervisors: job-supervisors-ls-faction-resident
  playTimeTracker: JobLSClerk
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 43200 # 6 hours
  weight: 10
  displayWeight: 10
  startingGear: LSClerkGear
  icon: "JobIconLSClerk"
  hideConsoleVisibility: true
  newPlayerMessage: false
  accessGroups:
  - LsrdGeneralAccess
  special:
  # Common v
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
  #lsrd specific
  - !type:AddComponentSpecial
    components:
    - type: IsLsrd
  - !type:AddImplantSpecial
    implants: [ FreelanceTrackingImplant ]
  #RPI
  - !type:AddRpiJobModifierSpecial
    modifiersToAdd:
    - rpiJobModifierDeputy # TODO: replace this
  - !type:AddRpiAuraSpecial
    aurasToAdd:
    - rpiAuraMassageTherapist # TODO: replace this
  - !type:RpiChatJudgementModifierSpecial
    modsToAdd:
    - rpiChatJudgementModifierMassageTherapist # TODO: replace this

- type: entity
  id: SpawnPointLSClerk
  parent: SpawnPointJobBase
  name: clerk spawn point
  suffix: LoneStar
  components:
  - type: SpawnPoint
    job_id: LSClerk
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner-red

- type: startingGear
  id: LSClerkGear
  equipment:
    pocket1: ContrabandAppraisalTool

