
#region Colorable Bases
- type: entity # for sprites with a single colored layer
  abstract: true
  id: ClothingHeadColorableMono
  suffix: Colorable
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "head-icon" ]
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        map: [ "head-equipped" ]
  - type: ColorableClothing
    available:
      - head-icon:
          icon: Base
        head-equipped:
          equipped-HELMET: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a set layer, and a single colored layer, supporting inhands
  abstract: true
  parent: ClothingHeadColorableMono
  id: ClothingHeadColorableMonoInhand
  suffix: Colorable
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        map: [ "hl-color" ]
      right:
      - state: inhand-right
        map: [ "hr-color" ]
  - type: ColorableClothing
    available:
      - head-icon:
          icon: Base
        head-equipped:
          equipped-HELMET: Base
        hl-color:
          inhand-left: Base
        hr-color:
          inhand-right: Base
    mappedColors:
      Base: NTInteriorDesign

- type: entity # for sprites with a set layer, and a single colored layer
  abstract: true
  parent: ClothingHeadColorableMono
  id: ClothingHeadColorableBaseColor
  suffix: Colorable
  components:
  - type: Sprite
