- type: entity
  name: tomato puree
  parent: FoodBakingBase
  id: FoodTomatoPuree
  description: A puree of tomato sauce, stirred to be thick and spreadable.
  components:
    - type: FlavorProfile
      flavors:
        - tomato
    - type: Sprite
      sprite: _Lonestar/Objects/Consumable/Food/sauce.rsi
      state: tomatopuree
    - type: SolutionContainerManager
      solutions:
        food:
          maxVol: 10
          reagents:
            - ReagentId: TomatoSauce
              Quantity: 10
    - type: Tag
      tags:
        - Ingredient
        - TomatoPuree

