# pompom foods

- type: entity
  name: puff-puff
  parent: FoodMealBase
  id: FoodMealPuffPuff
  description: A popular street food for moths, known by many names across the galaxy.
  components:
  - type: FlavorProfile
    flavors:
      - street-food
    ignoreReagents:
      - Nutriment
  - type: Sprite
    state: puffpuff
    sprite: _Impstation/Objects/Consumable/Food/Cloth/puffpuff.rsi
  - type: Item
    heldPrefix: puff-puffs
  - type: Food
    requiresSpecialDigestion: true
    trash:
    - FoodPacketFoodBoatTrash
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 35
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: TableSalt
          Quantity: 5
        - ReagentId: Fiber
          Quantity: 10
        - ReagentId: Sugar
          Quantity: 5
  - type: Tag
    tags:
    - ClothFood
    - ClothMade

- type: entity
  name: pomgo
  parent: FoodMealBase
  id: FoodMealPomgo
  description: Although a simple recipe, this classic treat of fluffy pom poms glazed in soy sauce remains popular to this day.
  components:
  - type: FlavorProfile
    flavors:
      - street-food
      - sweet
      - savory
      - Nutriment
  - type: Sprite
    state: pomgo
    sprite: _Impstation/Objects/Consumable/Food/Cloth/pomgo.rsi
  - type: Item
    heldPrefix: pomgo
  - type: Food
    requiresSpecialDigestion: true
    trash:
    - FoodKebabSkewer
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 35
        reagents:
        - ReagentId: Soysauce
          Quantity: 10
        - ReagentId: Fiber
          Quantity: 10
        - ReagentId: Sugar
          Quantity: 5
  - type: Tag
    tags:
    - ClothFood
    - ClothMade

- type: entity
  name: pompette
  parent: FoodMealBase
  id: FoodMealPompette
  description: A rich, savory take on traditional moth cuisine.
  components:
  - type: FlavorProfile
    flavors:
      - piquant
      - savory
    ignoreReagents:
      - Fiber
      - Nutriment
      - Vitamin
  - type: Sprite
    state: pompette
