# region base
# back (for gear)
- type: entity
  abstract: true
  parent: NFBaseNpcLootBackpack
  id: NFBaseNpcLootPackMercenary
  name: mercenary's gear bundle
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Duffels/color.rsi
    layers:
    - state: icon-base
      color: "#6e6e38"
    - state: icon-sling
      color: "#444444"
    - state: icon-decal-straps
      color: "#444444"
    - state: icon-handle
      color: "#444444"
    - state: icon-zipper
      color: "#bbbb7a"
  - type: Clothing
    sprite: _NF/Clothing/Back/Duffels/color.rsi
    clothingVisuals:
      back:
      - state: equipped-BACKPACK-base
        color: "#6e6e38"
      - state: equipped-BACKPACK-sling
        color: "#444444"
      - state: equipped-BACKPACK-decal-straps
        color: "#49492f"
      - state: equipped-BACKPACK-handle
        color: "#49492f"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-base
        color: "#6e6e38"
      - state: inhand-left-sling
        color: "#444444"
      - state: inhand-left-decal-straps
        color: "#49492f"
      - state: inhand-left-handle
        color: "#49492f"
      - state: inhand-left-zipper
        color: "#bbbb7a"
      right:
      - state: inhand-right-base
        color: "#6e6e38"
      - state: inhand-right-sling
        color: "#444444"
      - state: inhand-right-decal-straps
        color: "#49492f"
      - state: inhand-right-handle
        color: "#49492f"
      - state: inhand-right-zipper
        color: "#bbbb7a"

- type: entity
  abstract: true
  parent: NFBaseNpcLootBackpack
  id: NFBaseNpcLootPackMercenaryAlt
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _NF/Clothing/Back/Messenger/color.rsi
    layers:
    - state: icon-base
      color: "#6a6a36"
    - state: icon-sling
      color: "#6a6a36"
    - state: icon-clasp
      color: "#bbbb7a"
  - type: Clothing
    sprite: _NF/Clothing/Back/Messenger/color.rsi
    clothingVisuals:
      back:
      - state: base-equipped-BACKPACK
        color: "#6a6a36"
      - state: sling-equipped-BACKPACK
        color: "#6a6a36"
      - state: clasp-equipped-BACKPACK
        color: "#bbbb7a"
  - type: Item
    inhandVisuals:
      left:
      - state: base-inhand-left
        color: "#6a6a36"
      - state: clasp-inhand-left
        color: "#bbbb7a"
      right:
      - state: base-inhand-right
        color: "#6a6a36"
      - state: clasp-inhand-right
        color: "#bbbb7a"

# belt (for ammo and mags)
- type: entity
  abstract: true
  parent: NFBaseNpcLootBelt
  id: NFBaseNpcLootBeltMercenary
  name: mercenary's ammo pack
  components:
  - type: Sprite
    sprite: Clothing/Belt/mercwebbing.rsi
    state: icon

# wallet (for cash)
- type: entity
  abstract: true
  parent: NFBaseNpcLootWallet
  id: NFBaseNpcLootWalletMercenary
  name: mercenary's wallet
  components:
  - type: Sprite
    sprite: _NF/Clothing/Wallet/leather.rsi
    layers:
    - state: closed-color
      color: "#6a6a36"
    - state: closed-color-decal-01
      color: "#bbbb7a"

