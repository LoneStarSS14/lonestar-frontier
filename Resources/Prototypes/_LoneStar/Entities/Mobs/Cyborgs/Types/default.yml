#region Medical
- type: borgType
  id: medical
  dummyPrototype: BorgChassisMedical
  extraModuleCount: 2
  defaultModules:
  - BorgModuleTool
  - BorgModuleChemical
  - BorgModuleTopicals
  - BorgModuleRescue
  - BorgModuleJetpack
  - BorgModuleLollypopMedical
  addComponents:
  - type: SolutionScanner
