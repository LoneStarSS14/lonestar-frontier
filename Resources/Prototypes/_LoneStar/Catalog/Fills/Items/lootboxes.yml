      color: "#424242"
    - state: icon-decal-straps
      color: "#d36060"
    - state: icon-zipper
      color: "#ffdb0f"
      shader: unshaded
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-base
        color: "#424242"
      - state: inhand-left-decal-straps
        color: "#d36060"
      - state: inhand-left-zipper
        color: "#ffdb0f"
        shader: unshaded
      right:
      - state: inhand-right-base
        color: "#424242"
      - state: inhand-right-decal-straps
        color: "#d36060"
      - state: inhand-right-zipper
        color: "#ffdb0f"
        shader: unshaded
  - type: SpawnItemsOnUse
    items:
    - id: LSSpawnLootboxRangedRare

