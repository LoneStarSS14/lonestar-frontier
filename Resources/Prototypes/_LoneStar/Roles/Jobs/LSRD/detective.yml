- type: job
  id: LSDetective
  name: job-name-ls-detective
  description: job-description-ls-detective
  supervisors: job-supervisors-ls-chief-ranger
  playTimeTracker: JobLSDetective
  whitelisted: true
  requirements:
    # - !type:DepartmentTimeRequirement # To be enabled 2 weeks after implementation
    #   department: LSFreelancers
    #   time: 57600 # 16 hours
  weight: 30
  displayWeight: 30
  startingGear: LSDetectiveGear
  icon: "JobIconLSDetective"
  # Frontier's fields
  hideConsoleVisibility: true
  newPlayerMessage: false
  # Common v
  access:
  - Detective
  accessGroups:
  - GeneralNfsdAccess
  special:
  - !type:GiveItemOnHolidaySpecial
    holiday: FrontierBirthday
    prototype: FrontierBirthdayGift
  #lsrd specific
  - !type:AddComponentSpecial
    components:
    - type: IsNfsd # TODO: Rename this to IsLsrd
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant, TrackingImplant ]
  #RPI
  # TODO: Add rpis

- type: entity
  id: SpawnPointLSDetective
  parent: SpawnPointJobBase
  name: detective spawn point
  suffix: LoneStar
  components:
  - type: SpawnPoint
    job_id: LSDetective
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner-red

- type: startingGear
  id: LSDetectiveGear
  equipment:
    pocket1: NFWeaponRevolverInspector
    pocket2: ContrabandAppraisalTool
  storage:
    back:
    - Flash
    - NFSpeedLoaderPistol45Overpressure
    - NFSpeedLoaderPistol45Rubber
    - BaseSecurityUplinkRadioOfficer
    - ForensicPad
    - ForensicScanner
    - LogProbeCartridge
    - RubberStampDetective
    - ContrabandForensicsModule
    - FlashlightNfsdLite
    - ClothingHandsGlovesForensicNF

