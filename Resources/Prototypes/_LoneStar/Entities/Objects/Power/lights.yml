        acts: [ "Destruction" ]

- type: entity
  name: broken green floodlight
  id: FloodlightBrokenGreen
  parent: FloodlightBroken
  description: A pole with powerful green lights on it. It's broken.
  components:
  - type: GoblinPreciousTrash # Frontier
  - type: Item
    size: Normal
    sprite: _LoneStar/Objects/Misc/Lights/floodlight-green.rsi
    heldPrefix: broken
  - type: Sprite
    sprite: _LoneStar/Objects/Misc/Lights/floodlight-green.rsi
    state: icon-broken

- type: entity
