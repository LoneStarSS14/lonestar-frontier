- type: entity
  id: AtmosDeviceFanDirectionalFrame
  name: directional fan frame
  description: A thin fan, its not functional yet.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/directionalfan.rsi
    state: icon-frame
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.48,-0.48,0.48,-0.40"
  - type: Clickable
  - type: Construction
    graph: DirectionalFan
    node: directionalfanframe
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel:
            min: 3
            max: 6
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
