# Bases
- type: entity
  abstract: true
  parent: BaseItem
  id: BaseAdvCollarModule
  name: collar module (something)
  description: A module that can be installed into an advanced collar, this one does... something?
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: ssd
  - type: Item
    size: Tiny
  - type: AdvancedCollarModule

#region Modules
- type: entity
  parent: BaseAdvCollarModule
  id: AdvCollarModuleSealing
  name: collar module (sealing)
  description: A module that prevents the wearer from removing the collar themselves.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: ssd
  - type: AdvancedCollarModule
    componentToAdd: SelfUnremovableClothing
    moduleDescription: Prevents collar's self-removal

- type: entity
  parent: BaseAdvCollarModule
  id: AdvCollarModuleShock
  name: collar module (shock)
  description: A module that can remotely shock the wearer via wireless signal trigger.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: card_mini
  - type: AdvancedCollarModule
    componentsToAdd:
      - ShockOnTrigger
      - TriggerOnSignal
      - DeviceNetwork
      - WirelessNetworkConnection
      - DeviceLinkSink
    moduleDescription: Shocks wearer on wireless signal
  - type: ShockOnTrigger
    damage: 1
    duration: 2.5
    cooldown: 3.5
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: BasicDevice
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
      - Trigger

- type: entity
  parent: BaseAdvCollarModule
  id: AdvCollarModulePsychicClothingLock
  name: collar module (psychic clothing lock)
  description: An advanced module that locks specific clothing slots (head, feet, jumpsuit, gloves, eyes, mask, ears), preventing removal by the wearer only.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: radio_mini
  - type: AdvancedCollarModule
    componentToAdd: ClothingLock
    moduleDescription: Prevents wearer tampering with their clothes
  - type: ClothingLock
    lockedSlots:
    - head
    - shoes
    - jumpsuit
    - gloves
    - eyes
    - mask
    - ears
    blockOthers: false

- type: entity
  parent: BaseAdvCollarModule
  id: AdvCollarModuleSpeechModifier
  name: collar module (speech modifier)
  description: An advanced module that forces the user to speak in certain ways, or not at all.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: harddisk_micro
  - type: AdvancedCollarModule
    componentToAdd: CollarSpeechModifier
    moduleDescription: Modifies the wearer's speech
  - type: CollarSpeechModifier
    selectedType: Off

- type: entity
  parent: BaseAdvCollarModule
  id: AdvCollarModuleJingling
  name: collar module (bell)
  description: A module with a bell inside making it jingle.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: cpu
  - type: AdvancedCollarModule
    componentToAdd: EmitsSoundOnMove
    moduleDescription: Bell noises
  - type: EmitsSoundOnMove
    soundCollection:
      collection: FootstepJester

- type: entity
  parent: BaseAdvCollarModule
  id: AdvCollarModuleCowbell
  name: collar module (cowbell)
  description: A module with that makes a collar replicate a real cowbell in sound.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: cpu
  - type: AdvancedCollarModule
    componentToAdd: EmitsSoundOnMove
    moduleDescription: Cowbell noises
  - type: EmitsSoundOnMove
    soundCollection:
      collection: CowbellRings

- type: entity
  parent: BaseAdvCollarModule
  id: AdvCollarModulePsychicClothingLockPlus
  name: collar module (psychic clothing lock+)
  description: An advanced module that locks specific clothing slots, preventing removal by the wearer only.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: radio_mini
  - type: AdvancedCollarModule
    componentToAdd: ClothingLock
    moduleDescription: Prevents wearer tampering with almost all of their clothing
  - type: ClothingLock
    lockedSlots:
    - head
    - shoes
    - jumpsuit
    - gloves
    - eyes
    - mask
    - ears
    - outerClothing
    - back
    - belt
    blockOthers: false

- type: entity
  parent: BaseAdvCollarModule
  id: AdvCollarModuleWaddle
  name: collar module (waddle)
  description: A module that makes the wearer waddle.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: cpu_adv
  - type: AdvancedCollarModule
    componentToAdd: WaddleWhenWorn
    moduleDescription: Waddles when moving
  - type: WaddleWhenWorn
    tumbleIntensity: 10

- type: entity
  parent: BaseAdvCollarModule
  id: AdvCollarModuleStealth
  name: collar module (stealth)
  description: A module that makes the collar invisible when worn.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: card_mini
  - type: AdvancedCollarModule
    componentToAdd: HideClothingLayerClothing # TODO: Fix this not initializing on insertion while collars already worn
    moduleDescription: Invisible collar
  - type: HideClothingLayerClothing
    hiddenSlots:
    - neck

- type: entity
  parent: BaseAdvCollarModule
  id: AdvCollarModuleVulnerability
  name: collar module (vulnerability)
  description: A module that makes the wearer keel over to any stamina loss.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: secmodschematic
  - type: AdvancedCollarModule
    componentsToAdd:
    - StaminaResistance
    - GroupExamine
    moduleDescription: Stamina vulnerability
  - type: StaminaResistance
    damageCoefficient: 4

- type: entity
  parent: BaseAdvCollarModule
  id: AdvCollarModulePsychicShackle
  name: collar module (psychic walking)
  description: A module that inhibits its wearer to walk.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: beaker_holder
  - type: AdvancedCollarModule
    componentsToAdd:
    - ClothingSpeedModifier
    - GroupExamine
    moduleDescription: Forced walking
  - type: ClothingSpeedModifier # TODO: implement this in a better way.
    walkModifier: 1.0
    sprintModifier: 0.7

- type: entity
  parent: BaseAdvCollarModule
  id: AdvCollarModulePacifism
  name: collar module (pacifism)
  description: A module that inhibits violence.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: cart_connector
  - type: AdvancedCollarModule
    componentToAdd: WornPacifism
    moduleDescription: Inhibits violence
  - type: WornPacifism
#endregion
