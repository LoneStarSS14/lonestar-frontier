# region ammo blueprints
- type: entityTable
  id: LSSpawnLootSiliconsBlueprint
  table: !type:GroupSelector
    children:
    - !type:NestedSelector # Legendary
      weight: 1
      tableId: LSSpawnLootSiliconsBlueprintT5
    - !type:GroupSelector
      weight: 299
      children:
      - !type:NestedSelector # Epic
        weight: 1
        tableId: LSSpawnLootSiliconsBlueprintT4
      - !type:GroupSelector
        weight: 24
        children:
        - !type:NestedSelector # Rare
          weight: 1
          tableId: LSSpawnLootSiliconsBlueprintT3
        - !type:GroupSelector
          weight: 12
          children:
          - !type:NestedSelector # Uncommon
            weight: 1
            tableId: LSSpawnLootSiliconsBlueprintT2
          - !type:GroupSelector
            weight: 3
            children:
            - !type:NestedSelector # Common
              weight: 4
              tableId: LSSpawnLootSiliconsBlueprintT1
            - !type:NestedSelector # Trash
              weight: 1
              tableId: LSSpawnLootSiliconsBlueprintT0

