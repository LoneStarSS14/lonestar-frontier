- type: entity
  parent: [ClothingNeckCollarBase, BaseFoldable]
  id: ClothingNeckCollarBaseFoldable
  abstract: true
  components:
  - type: Foldable
    canFoldInsideContainer: true
    foldVerbText: unfold-verb
    unfoldVerbText: fold-verb
  - type: FoldableClothing
    foldedEquippedPrefix: folded

#region Colorable Bases
- type: entity # for sprites with a single colored layer
  abstract: true
  id: ClothingNeckColorableMono
  suffix: Colorable
  components:
  - type: Sprite
    layers:
    - state: icon
      map: [ "neck-icon" ]
  - type: Clothing
    clothingVisuals:
      neck:
      - state: equipped-NECK
        map: [ "neck-equipped" ]
  - type: ColorableClothing
    available:
      - neck-icon:
          icon: Base
        neck-equipped:
          equipped-NECK: Base
    mappedColors:
      Base: NTInteriorDesign
  - type: Tag
    tags:
    - ClothMade
    - Recyclable

- type: entity # for sprites with a single colored layer, supporting inhands
  abstract: true
  parent: ClothingNeckColorableMono
  id: ClothingNeckColorableMonoInhand
  suffix: Colorable
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        map: [ "hl-color" ]
      right:
      - state: inhand-right
        map: [ "hr-color" ]
  - type: ColorableClothing
    available:
      - neck-icon:
          icon: Base
        neck-equipped:
          equipped-NECK: Base
        hl-color:
          inhand-left: Base
        hr-color:
          inhand-right: Base
    mappedColors:
      Base: NTInteriorDesign

- type: entity # for sprites with a set layer, and a single colored layer
  abstract: true
  id: ClothingNeckColorableBaseColor
