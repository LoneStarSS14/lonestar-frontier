    - type: Paper
      content: "How to Play Over/Under\n(2 Players)\n\n1) Players put equal cash into a pot.\n2) Players choose Over/Under, refer to rule 3.\n3) Players each roll a d6, the higher player gets to choose first\n4) A d6 is rolled, if 4,5, or 6 is the result, Over wins. if 1, 2, or 3 is rolled, Under wins.\n5) Winner takes the entire pot.\n6) Loser says, \"Double or nothing?\" "
  - uid: 122
    components:
    - type: Transform
      pos: -0.5062656,1.402875
      parent: 2
    - type: Paper
      content: "How to play SpeedRacer\n(2-4 Players)\n1) A d20 is rolled any number of times, the results are added and this number is set as the \"speed limit\"\n2) Players Bet equal amounts and place the cash in a center pot.\n3) Players take turns rolling their choice between a d6 or a d4, each players result is added to their \"speed\"\n4) The first to reach the speed limit wins, going over the speed limit sets you back down to 20.\n5) Winner collects the pot. "
