# Notes:
# Medical ship garage, medical manager base and medical bounty staging area.
- type: pointOfInterest
  id: Medical
  parent: BasePOI
  name: 'St. Micheals Hospital'
  minimumDistance: 750
  maximumDistance: 1000
  spawnGroup: Required
  gridPath: /Maps/_NF/POI/medical.yml
  addComponents:
  - type: IFF
    color: "#00b7eb"
  - type: StationTransit
    routes:
      SpawnPoints: 30

- type: gameMap
  id: Medical
  mapName: 'St. Micheals Hospital'
  mapPath: /Maps/_NF/POI/medical.yml
  minPlayers: 0
  stations:
    Medical:
      stationProto: StandardFrontierDepot
      components:
        - type: StationNameSetup
          mapNameTemplate: 'St. Micheals Hospital'
        - type: ExtraStationInformation
          iconPath: /Textures/_NF/Interface/StationIcons/medic.png
          stationSubtext: 'frontier-lobby-medical-subtext'
          stationDescription: 'frontier-lobby-medical-description'
          lobbySortOrder: 4
        - type: StationJobs
          availableJobs:
            DirectorOfCare: [ 1, 1 ]
            MedicalNurse: [ -1, -1]
            Therapist: [ -1, -1]
            Pilot: [ -1, -1 ]
            Mercenary: [ -1, -1 ]
          tags:
          - HeadOfPersonnel
          - HeadOfSecurity
        - type: StationDeadDrop
          maxDeadDrops: 1 # Fewer here, players start here.
