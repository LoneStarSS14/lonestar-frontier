- type: entity
  parent: BaseStructure
  id: BaseDoubleBed
  abstract: true
  categories: [ HideSpawnMenu ]
  name: "double bed"
  description: "This is used to lie in, sleep in or strap to. Double the bed, double the fun!"
  components:
  - type: Sprite
    sprite: _Everdream/Structures/Furniture/doublebeds.rsi
    state: left
  - type: Physics
    bodyType: Static
  - type: Transform
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-1.45,-1.0,0.45,-0.2"
        hard: false
        density: 190
        mask:
        - TableMask
  - type: InteractionOutline
  - type: Anchorable
  - type: Pullable

# Double Beds Left
- type: entity
  parent: BaseDoubleBed
  id: DoubleBedLeft
  suffix: Left
  components:
  - type: Sprite
    state: left
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: "0, -0.25"
  - type: PlaceableSurface
    placeCentered: true
    positionOffset: "0, -0.25"

# Double Beds Right
- type: entity
  parent: BaseDoubleBed
  id: DoubleBedRight
  suffix: Right
  components:
  - type: Sprite
    state: right
  - type: Strap
    position: Down
    rotation: -90
    buckleOffset: "0, 0.35"
  - type: PlaceableSurface
    placeCentered: true
    positionOffset: "0, -0.35"
