# CRATE FILLING

- type: entity
  id: CrateBorgArmor
  parent: CrateSecgear
  name: synthetic armor crate
  description: Contains a variety pack of synthetic armor. For your aspiring silicon comrades.
  components:
  - type: StorageFill
    contents:
      - id: SyntheticBorgArmorLight
        amount: 2
      - id: SyntheticBorgArmorMedium
        amount: 2

- type: entity
  id: CrateBorgLight
  parent: CrateSecgear
  name: light synthetic armor crate
  description: Contains two seperate sets of armor to be bolted onto synthetics.
  components:
  - type: StorageFill
    contents:
      - id: SyntheticBorgArmorLight
        amount: 2
