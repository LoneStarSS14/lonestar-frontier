- type: entity
  id: ClothingOuterArmorElitePunkRandomized
  parent: [ ClothingOuterStorageBase, ClothingOuterArmorBulletproof, RecyclableItemClothArmor, BaseC1Contraband ]
  name: punk heavy armor
  suffix: Random visuals
  components:
  - type: Sprite
    sprite: _NF/Clothing/OuterClothing/Armor/bulletproof_vest_procedural_elite.rsi
    layers:
    - state: base_OuterClothing_armor_01
      map: [ "armor_elite_main" ]
    - state: mask_null
      map: [ "armor_elite_decor" ]
    - state: mask_null
      map: [ "armor_elite_overlay" ]
      shader: unshaded
  - type: Clothing
    sprite: _NF/Clothing/OuterClothing/Armor/bulletproof_vest_procedural_elite.rsi
    clothingVisuals:
      outerClothing:
      - state: base_OuterClothing_armor_01
        map: [ "armor_elite_main" ]
      - state: mask_null
        map: [ "armor_elite_decor" ]
      - state: mask_null
        map: [ "armor_elite_overlay" ]
        shader: unshaded
  - type: ColorableClothing # LoneStar
    denyReroll: false
    mappedColors:
      Primary: CyberpunkDark
      Secondary: CyberpunkDark
      Glow: CyberpunkNeon
    available:
    - armor_elite_main:
        base_OuterClothing_armor_01: Primary
      armor_elite_decor:
        decor_base_OuterClothing_armor_01: Secondary
        decor_base_OuterClothing_armor_02: Secondary
        decor_base_OuterClothing_armor_03: Secondary
        decor_base_OuterClothing_armor_04: Secondary
        decor_base_OuterClothing_armor_05: Secondary
      armor_elite_overlay:
        overlay_base_OuterClothing_armor_01: Glow
