#region Base
- type: entity
  id: BaseMaidBorgChassisSelectable
  parent: BorgChassisSelectable
  abstract: true
  components:
  - type: Sprite
    sprite: _LoneStar/Entities/Mobs/Silicon/Cyborg/maid.rsi
    layers:
    - state: robot
      map: ["enum.BorgVisualLayers.Body", "movement"]
    - state: robot_e_r
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - state: robot_l
      shader: unshaded
      map: ["light", "enum.BorgVisualLayers.LightStatus"]
      visible: false
  - type: BorgChassis
    hasMindState: robot_e
    noMindState: robot_e_r

#region Generic
- type: entity
  id: MaidBorgChassisGeneric
  parent: BaseMaidBorgChassisSelectable
  name: generic maidborg
  components:
