#region base
- type: entity
  id: NFBaseWeaponFrameLightMachineGun
  parent: [ NFBaseWeaponEncumbranceLMG, NFBaseItemWeaponGunMagazineFed ] # Lonestar
  suffix: Frontier
  abstract: true
  components:
  - type: Wieldable
    unwieldOnUse: false
  - type: GunRequiresWield
  - type: GunWieldBonus
    minAngle: -0 # Set to 0 because GunRequiresWield
    maxAngle: -0
  - type: Gun
    projectileSpeed: 35
    minAngle: 3.1
    maxAngle: 15.5
    # Lonestar changes start
    angleIncrease: 2
    angleDecay: 10
    fireRate: 6
    #burstFireRate: 5
    #shotsPerBurst: 5
    #burstCooldown: 1
    # Lonetart changes end
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    #- Burst #Lonestar
  - type: NFWeaponDetails
    class: weapon-details-class-light-machine-gun

#region manufacturer
- type: entity
  id: NFBaseWeaponFrameLightMachineGunGorlex
  parent: [ BaseC4Contraband, NFBaseWeaponFrameLightMachineGun ] # Coyote: BaseC3SyndicateContraband < BaseC4Contraband
  abstract: true
  components:
  - type: Gun
    # Lonestar changes start
    minAngle: 4.2
    maxAngle: 18.5
    # Lonestar changes end
    angleIncrease: 1.5
    angleDecay: 5.4
  - type: NFWeaponDetails
    manufacturer: weapon-details-manufacturer-gorlex-steel-works

#region chamber
- type: entity
  id: NFBaseWeaponLightMachineGunChamber20
  abstract: true
  components:
  - type: Gun
    examineCaliber: gun-examine-caliber-20
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/lmg.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/lmg_empty.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/lmg_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: NFMagazineBoxRifle20
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - NFMagazineBoxRifle20
      gun_chamber:
        name: Chamber
        startingItem: NFCartridgeRifle20
        priority: 1
        whitelist:
          tags:
            - NFCartridgeRifle20
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
