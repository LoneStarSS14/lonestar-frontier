- type: inventoryTemplate
  id: borgUnified # As a note. This may break hat offsets, but they were broken anyway for all-non default borgs.
  slots:
  - name: head
    slotTexture: head
    slotFlags: HEAD
    uiWindowPos: 1,0
    strippingWindowPos: 0,0
    displayName: Head
    offset: 0.015625, 0
  - name: id
    slotTexture: id
    slotFlags: IDCARD
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 2,1
    strippingWindowPos: 2,4
    displayName: ID
  - name: ears
    slotTexture: ears
    slotFlags: EARS
    stripTime: 3
    uiWindowPos: 2,2
    strippingWindowPos: 2,0
    displayName: Ears
  - name: back
    slotTexture: back
    fullTextureName: template_small
    slotFlags: BACK
    slotGroup: SecondHotbar
    stripTime: 6
    uiWindowPos: 3,0
    strippingWindowPos: 0,5
    displayName: Back
  - name: armor # Controls them being able to wear additional armor. Disable if you do not want to use this module. (And remove the cargo/research entries ofc)
    slotTexture: suit_storage
    slotFlags: BORGARMOR
    uiWindowPos: 1,2
    strippingWindowPos: 0,0
    displayName: Suit # I am not adding a .ftl just for this.
    whitelist:
      tags:
        - BorgWearable