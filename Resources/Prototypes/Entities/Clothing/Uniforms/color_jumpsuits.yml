## LoneStar, all sprite/item/clothing map lines added, also BaseClothingUniformJumpsuitColorable parent added

# White Jumpsuit
- type: entity
  parent: [ ClothingUniformSkirtBase, BaseClothingUniformJumpsuitColorable ]
  id: ClothingUniformJumpsuitColorWhite
  name: white jumpsuit
  description: A generic white jumpsuit with no rank markings.
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/color.rsi
    layers:
    - state: icon
      map: [ "uniform-icon" ]
    - state: trinkets-icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        map: [ "hl-color" ]
      - state: trinkets-inhand-left
      right:
      - state: inhand-right
        map: [ "hr-color" ]
      - state: trinkets-inhand-right
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/color.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        map: [ "uniform-equipped" ]
      - state: trinkets-equipped-INNERCLOTHING

